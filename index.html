<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpråkStudio Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{
  --blue-deep:#0B4F8A; --blue:#1A6DB0; --gold:#FFC72C; --gold-soft:#FFE79A;
  --cream:#FFF8EA; --ink:#12314F; --green:#3AA65B; --red:#E05252; --purple:#6E5CA6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;font-family:'Nunito',sans-serif;
  background:radial-gradient(circle at 15% 10%,#1a76c4 0%,var(--blue-deep) 55%,#082f52 100%);
  color:var(--ink); -webkit-user-select:none; user-select:none;}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 3vw;}
.hidden{display:none !important;}
.msi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;
  font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 40;vertical-align:middle;line-height:1;}
h1{font-family:'Fredoka',sans-serif;color:var(--cream);font-size:clamp(1.8rem,4vw,3rem);margin:0 0 .2em;}
h2{font-family:'Fredoka',sans-serif;color:var(--blue-deep);font-size:clamp(1.3rem,2.4vw,1.9rem);margin:.2em 0;}
p.sub{color:var(--gold-soft);font-weight:600;margin-top:0;}
.card{background:var(--cream);border-radius:28px;box-shadow:0 14px 0 rgba(11,79,138,.2),0 20px 40px rgba(0,0,0,.25);
  padding:3.5vh 3.5vw;width:min(560px,92vw);text-align:center;}
.role-row{display:flex;gap:1.4rem;margin-top:2rem;justify-content:center;flex-wrap:wrap;}
.role-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.2rem;background:var(--cream);color:var(--blue-deep);
  border:none;border-radius:22px;padding:1.8rem 2.2rem;cursor:pointer;box-shadow:0 9px 0 rgba(11,79,138,.25);
  display:flex;flex-direction:column;align-items:center;gap:.4rem;}
.role-btn:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(11,79,138,.25);}
.role-btn .msi{font-size:2.8rem;}
input{font-family:'Nunito',sans-serif;font-weight:700;font-size:1.2rem;padding:.8rem 1.1rem;border-radius:14px;
  border:3px solid #d8ceb3;width:100%;margin-top:.7rem;text-align:center;background:#fff;color:var(--ink);}
input:focus{outline:none;border-color:var(--blue);}
.primary-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;background:var(--gold);color:var(--blue-deep);
  border:none;border-radius:16px;padding:.9rem 1.8rem;cursor:pointer;margin-top:1.2rem;box-shadow:0 7px 0 rgba(0,0,0,.12);}
.primary-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.12);}
.primary-btn:disabled{opacity:.5;}
.code-display{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2.4rem,6vw,4rem);letter-spacing:.15em;
  color:var(--blue-deep);background:var(--gold-soft);border-radius:18px;padding:.3em .2em;margin:.8rem 0;}
.board-wrap{width:min(1150px,95vw);}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2vh;gap:1rem;flex-wrap:wrap;}
.room-pill{background:rgba(255,255,255,.15);color:var(--cream);font-family:'Fredoka',sans-serif;font-weight:700;
  border-radius:999px;padding:.5em 1.2em;font-size:1.1rem;letter-spacing:.08em;}
.avatars{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;}
.avatar-pill{background:var(--cream);border-radius:999px;padding:.4em .9em;display:flex;align-items:center;gap:.35em;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:1rem;box-shadow:0 5px 0 rgba(11,79,138,.15);}
.avatar-pill.is-drawer{background:var(--purple);color:#fff;}
.score{color:var(--blue);font-weight:800;}
.avatar-pill.is-drawer .score{color:#fff;}
.mini-leaderboard{position:absolute;top:1.5vh;right:1.5vw;background:rgba(18,49,79,.85);border-radius:16px;
  padding:.7em 1em;color:var(--cream);font-family:'Fredoka',sans-serif;font-size:.95rem;z-index:5;}
.mini-leaderboard div{display:flex;justify-content:space-between;gap:1em;padding:.15em 0;}
.mini-leaderboard .lb-score{color:var(--gold);font-weight:700;}
.round-card{background:var(--cream);border-radius:28px;padding:3vh 3vw;box-shadow:0 14px 0 rgba(11,79,138,.2);
  width:100%;text-align:center;position:relative;}
.timer-bar-wrap{width:100%;height:14px;background:#e6ddc4;border-radius:999px;overflow:hidden;margin-bottom:1.4vh;}
.timer-bar{height:100%;background:var(--gold);border-radius:999px;transition:width .3s linear;}
.round-type-label{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--blue);font-size:1rem;
  text-transform:none;margin-bottom:.3em;display:flex;align-items:center;justify-content:center;gap:.3em;}
.word-hint{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:.25em;
  color:var(--blue-deep);}
canvas.draw-canvas{background:#fff;border-radius:18px;box-shadow:inset 0 0 0 4px #e6ddc4;touch-action:none;
  width:100%;max-width:560px;height:min(340px,42vh);}
.brush-row{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:1rem;flex-wrap:wrap;}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
.swatch.active{border-color:var(--blue);}
.tool-btn{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:2px solid var(--blue);color:var(--blue);
  border-radius:12px;padding:.4em .8em;cursor:pointer;font-size:.95rem;}
.statement-text{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(1.2rem,2.4vw,1.7rem);color:var(--blue-deep);
  margin:1rem 0 1.4rem;}
.tf-row{display:flex;gap:1.2rem;justify-content:center;}
.tf-btn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;border:none;border-radius:18px;
  padding:1.1rem 2.2rem;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.15);color:#fff;}
.tf-btn.true{background:var(--green);}
.tf-btn.false{background:var(--red);}
.tf-btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.15);}
.chip-row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin:1rem 0;min-height:2.6em;}
.chip{font-family:'Nunito',sans-serif;font-weight:700;background:#fff;border:2px solid var(--blue);color:var(--blue-deep);
  border-radius:12px;padding:.5em 1em;cursor:pointer;font-size:1.05rem;}
.chip.used{opacity:.3;pointer-events:none;}
.build-row{min-height:2.6em;border:3px dashed #d8ceb3;border-radius:14px;padding:.6em;display:flex;gap:.4rem;
  flex-wrap:wrap;justify-content:center;margin-bottom:.8rem;}
.build-row .chip{border-color:var(--gold);background:var(--gold-soft);}
.sign-box{background:#fff;border:3px solid var(--blue-deep);border-radius:14px;padding:1.2em 1.4em;margin:1rem auto;
  max-width:360px;text-align:left;font-family:'Nunito',sans-serif;}
.sign-box .sign-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.1rem;color:var(--blue-deep);
  display:flex;align-items:center;gap:.4em;margin-bottom:.4em;}
.sign-box .sign-line{font-size:1rem;color:var(--ink);padding:.15em 0;}
.choice-col{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem;max-width:400px;margin-left:auto;margin-right:auto;}
.choice-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:1.05rem;background:#fff;border:3px solid var(--blue);
  color:var(--blue-deep);border-radius:16px;padding:.85em 1.2em;cursor:pointer;}
.choice-btn:active{background:var(--blue);color:#fff;}
.choice-btn:disabled{opacity:.5;}
.status-line{font-family:'Fredoka',sans-serif;font-weight:600;color:#8a95a6;margin-top:.6rem;}
.result-flash{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.4rem;margin-top:.8rem;}
.result-flash.correct{color:var(--green);}
.result-flash.wrong{color:var(--red);}
.leaderboard-table{width:100%;border-collapse:collapse;margin-top:1rem;}
.leaderboard-table td{padding:.5em .3em;font-family:'Nunito',sans-serif;font-weight:700;text-align:left;}
.leaderboard-table .rank{font-family:'Fredoka',sans-serif;color:var(--blue);width:2em;}
.leaderboard-table .delta-up{color:var(--green);}
.leaderboard-table .delta-down{color:var(--red);}
.leaderboard-table .gained{color:var(--gold);font-family:'Fredoka',sans-serif;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1rem;margin:2vh 0;}
.podium-slot{background:var(--cream);border-radius:16px 16px 0 0;padding:1rem;text-align:center;font-family:'Fredoka',sans-serif;font-weight:700;}
.podium-slot.p1{height:180px;background:var(--gold);}
.podium-slot.p2{height:140px;}
.podium-slot.p3{height:110px;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.pulse{animation:pulse 1.3s infinite ease-in-out;}
.player-idle{text-align:center;}
.player-idle .big-emoji{font-size:3.6rem;}
.player-name-tag{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;color:var(--blue-deep);}
</style>
</head>
<body>
<div id="app">

<div id="role-screen">
  <h1>🇸🇪 SpråkStudio Party</h1>
  <p class="sub">Vem är du?</p>
  <div class="role-row">
    <button class="role-btn" id="host-role-btn"><span class="msi">desktop_windows</span>Lärare<br>(smartboard)</button>
    <button class="role-btn" id="player-role-btn"><span class="msi">tablet_mac</span>Elev<br>(iPad)</button>
  </div>
</div>

<div id="host-create-screen" class="hidden">
  <div class="card"><h2>Skapa ett rum</h2>
    <button class="primary-btn" id="create-room-btn">Skapa rum</button>
  </div>
</div>

<div id="host-board-screen" class="hidden board-wrap" style="position:relative;">
  <div class="top-bar">
    <div class="room-pill" id="host-room-code">KOD: ----</div>
    <div class="avatars" id="host-avatars"></div>
  </div>
  <div id="host-lobby-view" class="card" style="width:100%;">
    <h2>Väntar på elever...</h2>
    <p class="sub" style="color:#8a95a6;">Eleverna skriver in koden på sin iPad</p>
    <button class="primary-btn" id="start-game-btn" disabled>Starta spelet</button>
  </div>
  <div id="host-round-view" class="hidden" style="position:relative;width:100%;">
    <div class="mini-leaderboard" id="host-mini-lb"></div>
    <div class="round-card">
      <div class="round-type-label" id="round-type-label"></div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="host-timer-bar" style="width:100%;"></div></div>
      <div id="round-content-host"></div>
    </div>
  </div>
  <div id="host-roundend-view" class="hidden card" style="width:100%;">
    <h2 id="roundend-title">Rundan är slut!</h2>
    <p class="sub" id="roundend-reveal" style="color:#8a95a6;"></p>
    <table class="leaderboard-table" id="roundend-table"></table>
    <button class="primary-btn" id="next-round-btn">Nästa runda</button>
    <button class="primary-btn" id="end-game-btn" style="background:#e6ddc4;">Avsluta spelet</button>
  </div>
  <div id="host-finished-view" class="hidden card" style="width:100%;">
    <h2>🏆 Spelet är slut!</h2>
    <div class="podium" id="podium"></div>
  </div>
</div>

<div id="player-join-screen" class="hidden">
  <div class="card"><h2>Gå med i rummet</h2>
    <input id="join-code" placeholder="KOD" maxlength="4" style="text-transform:uppercase;">
    <input id="join-name" placeholder="Ditt namn" maxlength="16">
    <button class="primary-btn" id="join-btn">Gå med</button>
    <div id="join-error" style="color:var(--red);font-weight:700;margin-top:.5rem;"></div>
  </div>
</div>

<div id="player-game-screen" class="hidden" style="width:min(480px,94vw);">
  <div class="card" style="width:100%;">
    <div id="player-idle-view" class="player-idle">
      <div class="big-emoji msi">hourglass_top</div>
      <div class="player-name-tag" id="player-name-tag"></div>
      <p class="sub" id="player-status-text" style="color:#8a95a6;">Väntar på läraren...</p>
    </div>
    <div id="player-round-view" class="hidden">
      <div class="mini-leaderboard" id="player-mini-lb" style="position:static;display:inline-block;margin-bottom:1rem;"></div>
      <div id="round-content-player"></div>
    </div>
    <div id="player-roundend-view" class="hidden">
      <div class="big-emoji msi" id="roundend-player-icon">emoji_events</div>
      <div id="roundend-player-text" class="result-flash"></div>
      <p class="sub" style="color:#8a95a6;">Väntar på läraren...</p>
    </div>
  </div>
</div>

</div>

<script>
const AVATARS=["🦊","🐻","🐼","🐸","🦁","🐨","🐯","🐰","🐷","🐵"];
const DRAW_CATEGORIES={
  mat:{name:"Mat",emoji:"🍎",words:["äpple","bröd","mjölk","ägg","fisk","kaffe","banan","ost"]},
  djur:{name:"Djur",emoji:"🐶",words:["hund","katt","häst","ko","gris","fågel"]},
  hem:{name:"Hem",emoji:"🏠",words:["stol","bord","säng","dörr","lampa","soffa"]},
  kropp:{name:"Kropp",emoji:"🧍",words:["hand","fot","öga","öra","mun","hår"]},
  vader:{name:"Väder",emoji:"☀️",words:["sol","regn","snö","moln"]}
};
const SENTENCES=[
  ["Jag","heter","Ali"],["Hon","bor","här"],["Vi","äter","mat"],
  ["Han","dricker","kaffe"],["Barnet","sover"],["Jag","mår","bra"],
  ["Katten","sover"],["Vi","går","hem"]
];
const STATEMENTS=[
  {text:"Solen är gul.",isTrue:true},
  {text:"En hund är ett fordon.",isTrue:false},
  {text:"Mjölk är vit.",isTrue:true},
  {text:"En banan är blå.",isTrue:false},
  {text:"Vintern är kall.",isTrue:true},
  {text:"Bröd är mat.",isTrue:true},
  {text:"En katt kan flyga.",isTrue:false},
  {text:"ICA är en matbutik.",isTrue:true}
];
const SIGNS=[
  {icon:"storefront",title:"ICA Affär",lines:["Öppet: Mån–Fre 9–18","Lördag 10–15","Söndag Stängt"],
   question:"Är affären öppen på söndag?",choices:["Ja","Nej","Vet inte"],correct:"Nej"},
  {icon:"receipt_long",title:"Kvitto",lines:["Mjölk .......... 15 kr","Bröd .......... 25 kr","Totalt ......... 40 kr"],
   question:"Vad kostar mjölken?",choices:["15 kr","25 kr","40 kr"],correct:"15 kr"},
  {icon:"directions_bus",title:"Busshållplats",lines:["Buss 4 → Centrum","Avgång var 10:e minut"],
   question:"Hur ofta kommer buss 4?",choices:["Var 10:e minut","Var timme","En gång om dagen"],correct:"Var 10:e minut"},
  {icon:"local_pharmacy",title:"Apoteket",lines:["Öppet alla dagar","8–22"],
   question:"Kan man handla på apoteket en söndag kväll?",choices:["Ja","Nej","Vet inte"],correct:"Ja"}
];
const ROUND_DURATIONS={draw:90,truefalse:15,wordorder:40,sign:20};
const NON_DRAW_TYPES=["truefalse","wordorder","sign"];

async function readRoom(code){
  try{const r=await fetch('/api/room?code='+encodeURIComponent(code));if(!r.ok)return null;
    const j=await r.json();return j.value||null;}catch(e){return null;}
}
async function writeRoom(code,state){
  try{const r=await fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code,state})});return r.ok;}catch(e){return false;}
}
async function updateRoom(code,mutateFn,retries=5){
  for(let i=0;i<retries;i++){
    const cur=await readRoom(code); if(!cur) return false;
    const next=mutateFn(JSON.parse(JSON.stringify(cur))); if(!next) return false;
    if(await writeRoom(code,next)) return true;
  }
  return false;
}
function randomCode(){const L="ABCDEFGHJKLMNPQRSTUVWXYZ";let c="";for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c;}
function newId(){return Math.random().toString(36).slice(2,10);}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function calcScore(timeLeftFraction,combo){
  const base=200+Math.round(800*Math.max(0,Math.min(1,timeLeftFraction)));
  const mult=1+0.1*Math.min(combo,5);
  return Math.round(base*mult);
}
function show(id){
  ['role-screen','host-create-screen','host-board-screen','player-join-screen','player-game-screen']
    .forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));
}
document.getElementById('host-role-btn').addEventListener('click',()=>show('host-create-screen'));
document.getElementById('player-role-btn').addEventListener('click',()=>show('player-join-screen'));

/* ================= ROUND BUILDERS ================= */
function buildRound(type,drawerId,lastUsed){
  if(type==='draw'){
    const catKeys=Object.keys(DRAW_CATEGORIES);
    const catKey=pickRandom(catKeys); const cat=DRAW_CATEGORIES[catKey];
    const word=pickRandom(cat.words);
    return {type:'draw',drawerId,word,wordLength:word.length,emoji:cat.emoji,strokes:[],correctPlayerIds:[]};
  }
  if(type==='truefalse'){
    const s=pickRandom(STATEMENTS);
    return {type:'truefalse',statement:s.text,isTrue:s.isTrue};
  }
  if(type==='wordorder'){
    const words=pickRandom(SENTENCES);
    return {type:'wordorder',correctOrder:words,scrambled:shuffle(words)};
  }
  if(type==='sign'){
    const s=pickRandom(SIGNS);
    return {type:'sign',icon:s.icon,title:s.title,lines:s.lines,question:s.question,choices:s.choices,correct:s.correct};
  }
}
function buildPlan(players){
  const plan=[];
  players.forEach(p=>{
    plan.push({type:'draw',drawerId:p.id});
    plan.push({type:pickRandom(NON_DRAW_TYPES)});
  });
  return plan;
}

/* ================= HOST LOGIC ================= */
let hostCode=null, hostPollTimer=null, hostRenderedRoundKey=null;

document.getElementById('create-room-btn').addEventListener('click', async ()=>{
  hostCode=randomCode();
  const initial={code:hostCode,phase:'lobby',players:[],plan:[],planIndex:-1,round:null,lastRoundResult:null};
  await writeRoom(hostCode,initial);
  document.getElementById('host-room-code').textContent='KOD: '+hostCode;
  show('host-board-screen');
  hostPollTimer=setInterval(hostPoll,1000);
  hostPoll();
});

async function hostPoll(){
  const state=await readRoom(hostCode); if(!state) return;
  renderAvatars(document.getElementById('host-avatars'),state);
  document.getElementById('start-game-btn').disabled = state.players.length<1;
  document.getElementById('host-lobby-view').classList.toggle('hidden', state.phase!=='lobby');
  document.getElementById('host-round-view').classList.toggle('hidden', state.phase!=='active');
  document.getElementById('host-roundend-view').classList.toggle('hidden', state.phase!=='round-end');
  document.getElementById('host-finished-view').classList.toggle('hidden', state.phase!=='finished');

  if(state.phase==='active' && state.round){
    renderMiniLB(document.getElementById('host-mini-lb'),state);
    const dur=ROUND_DURATIONS[state.round.type];
    const elapsed=(Date.now()-state.round.startedAt)/1000;
    const timeLeft=Math.max(0,dur-elapsed);
    document.getElementById('host-timer-bar').style.width=(100*timeLeft/dur)+'%';
    const key=state.round.type+':'+(state.round.word||state.round.statement||state.round.title||JSON.stringify(state.round.correctOrder))+':'+state.planIndex;
    if(hostRenderedRoundKey!==key){ hostRenderedRoundKey=key; renderHostRound(state); }
    else if(state.round.type==='draw'){ redrawCanvas(document.getElementById('host-canvas'),state.round.strokes); }

    const answeredCount=Object.keys(state.round.answers||{}).length;
    const doneEarly = state.round.type==='draw'
      ? (state.round.correctPlayerIds||[]).length >= (state.players.length-1) && state.players.length>1
      : answeredCount >= state.players.length;
    if(timeLeft<=0 || doneEarly){ await finalizeRound(state); }
  }
  if(state.phase==='round-end'){ renderRoundEnd(state); }
  if(state.phase==='finished'){ renderPodium(state); }
}

function renderAvatars(wrap,state){
  wrap.innerHTML='';
  state.players.forEach(p=>{
    const isDrawer = state.round && state.round.type==='draw' && state.round.drawerId===p.id && state.phase==='active';
    const pill=document.createElement('div');
    pill.className='avatar-pill'+(isDrawer?' is-drawer':'');
    pill.innerHTML=`${p.avatar} ${p.name} <span class="score">${p.score}</span>`;
    wrap.appendChild(pill);
  });
}
function renderMiniLB(el,state){
  const sorted=[...state.players].sort((a,b)=>b.score-a.score).slice(0,4);
  el.innerHTML=sorted.map(p=>`<div><span>${p.avatar} ${p.name}</span><span class="lb-score">${p.score}</span></div>`).join('');
}

function renderHostRound(state){
  const r=state.round;
  const label=document.getElementById('round-type-label');
  const body=document.getElementById('round-content-host');
  if(r.type==='draw'){
    label.innerHTML=`<span class="msi">brush</span> Rita & Gissa`;
    body.innerHTML=`<div class="word-hint">${'_ '.repeat(r.wordLength)}</div>
      <canvas class="draw-canvas" id="host-canvas" width="560" height="340"></canvas>`;
    redrawCanvas(document.getElementById('host-canvas'),r.strokes);
  } else if(r.type==='truefalse'){
    label.innerHTML=`<span class="msi">quiz</span> Rätt eller fel`;
    body.innerHTML=`<div class="statement-text">"${r.statement}"</div>`;
  } else if(r.type==='wordorder'){
    label.innerHTML=`<span class="msi">sort</span> Bygg meningen`;
    body.innerHTML=`<div class="chip-row">${r.scrambled.map(w=>`<span class="chip">${w}</span>`).join('')}</div>`;
  } else if(r.type==='sign'){
    label.innerHTML=`<span class="msi">signpost</span> Vad säger skylten?`;
    body.innerHTML = renderSignHTML(r) + `<div class="statement-text" style="font-size:1.2rem;">${r.question}</div>`;
  }
}
function renderSignHTML(r){
  return `<div class="sign-box">
    <div class="sign-title"><span class="msi">${r.icon}</span>${r.title}</div>
    ${r.lines.map(l=>`<div class="sign-line">${l}</div>`).join('')}
  </div>`;
}
function redrawCanvas(canvas,strokes){
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  (strokes||[]).forEach(s=>{
    if(!s.points||s.points.length<1) return;
    ctx.beginPath();
    ctx.strokeStyle=s.color; ctx.lineWidth=s.size; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.moveTo(s.points[0].x*canvas.width,s.points[0].y*canvas.height);
    for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x*canvas.width,s.points[i].y*canvas.height);
    ctx.stroke();
  });
}

async function finalizeRound(state){
  const scoreSnapshot=state.round.scoreSnapshot || {};
  const rankBefore=[...state.players].sort((a,b)=>(scoreSnapshot[b.id]||0)-(scoreSnapshot[a.id]||0)).map(p=>p.id);

  await updateRoom(hostCode, s=>{
    if(s.phase!=='active') return s;
    const r=s.round;
    if(r.type==='draw'){
      const correctIds=r.correctPlayerIds||[];
      const drawer=s.players.find(p=>p.id===r.drawerId);
      if(drawer){
        drawer.score += 50*correctIds.length;
        drawer.combo = correctIds.length>0 ? (drawer.combo||0)+1 : 0;
      }
      s.players.forEach(p=>{
        if(p.id!==r.drawerId && !correctIds.includes(p.id)) p.combo=0;
      });
    } else {
      const answers=r.answers||{};
      s.players.forEach(p=>{
        const a=answers[p.id];
        if(!a || !a.correct) p.combo=0;
      });
    }
    const rankAfter=[...s.players].sort((a,b)=>b.score-a.score).map(p=>p.id);
    const pointsThisRound={};
    s.players.forEach(p=>{ pointsThisRound[p.id]=p.score-(scoreSnapshot[p.id]||0); });
    s.lastRoundResult={type:r.type, reveal:revealText(r), rankBefore, rankAfter, pointsThisRound};
    s.phase='round-end';
    return s;
  });
}
function revealText(r){
  if(r.type==='draw') return 'Ordet var: '+r.word;
  if(r.type==='truefalse') return r.isTrue ? 'Sant!' : 'Falskt!';
  if(r.type==='wordorder') return 'Rätt mening: '+r.correctOrder.join(' ');
  if(r.type==='sign') return 'Rätt svar: '+r.correct;
}

function renderRoundEnd(state){
  const res=state.lastRoundResult;
  document.getElementById('roundend-reveal').textContent = res ? res.reveal : '';
  const table=document.getElementById('roundend-table');
  const sorted=[...state.players].sort((a,b)=>b.score-a.score);
  table.innerHTML = sorted.map((p,i)=>{
    const before=res.rankBefore.indexOf(p.id);
    const after=res.rankAfter.indexOf(p.id);
    let arrow='';
    if(before>after) arrow=`<span class="delta-up">▲${before-after}</span>`;
    else if(before<after) arrow=`<span class="delta-down">▼${after-before}</span>`;
    else arrow='–';
    const gained=res.pointsThisRound[p.id]||0;
    return `<tr><td class="rank">#${i+1}</td><td>${p.avatar} ${p.name}</td>
      <td>${arrow}</td><td class="gained">+${gained}</td><td>${p.score}</td></tr>`;
  }).join('');
}
function renderPodium(state){
  const sorted=[...state.players].sort((a,b)=>b.score-a.score);
  const el=document.getElementById('podium');
  const slots=[[1,'p1'],[0,'p2'],[2,'p3']];
  el.innerHTML = slots.filter(([idx])=>sorted[idx]).map(([idx,cls])=>{
    const p=sorted[idx];
    return `<div class="podium-slot ${cls}"><div style="font-size:2rem;">${p.avatar}</div>${p.name}<br>${p.score}p</div>`;
  }).join('');
}

document.getElementById('start-game-btn').addEventListener('click', async ()=>{
  const state=await readRoom(hostCode); if(!state||state.players.length<1) return;
  const plan=buildPlan(state.players);
  await updateRoom(hostCode, s=>{ s.plan=plan; s.planIndex=-1; return s; });
  await advanceRound();
});
document.getElementById('next-round-btn').addEventListener('click', advanceRound);
document.getElementById('end-game-btn').addEventListener('click', async ()=>{
  await updateRoom(hostCode, s=>{ s.phase='finished'; return s; });
});

async function advanceRound(){
  await updateRoom(hostCode, s=>{
    let idx=s.planIndex+1;
    if(idx>=s.plan.length){ s.plan=s.plan.concat(buildPlan(s.players)); }
    const planItem=s.plan[idx];
    const round=buildRound(planItem.type, planItem.drawerId);
    round.startedAt=Date.now();
    round.answers={};
    const snap={}; s.players.forEach(p=>snap[p.id]=p.score);
    round.scoreSnapshot=snap;
    s.round=round; s.planIndex=idx; s.phase='active';
    return s;
  });
  hostRenderedRoundKey=null;
}

/* ================= PLAYER LOGIC ================= */
let playerCode=null, playerId=null, playerPollTimer=null, playerRenderedRoundKey=null;
let wordOrderLocal=[];
let drawState={color:'#12314F',size:4,strokes:[],currentStroke:null,lastSync:0};

document.getElementById('join-btn').addEventListener('click', async ()=>{
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  const name=document.getElementById('join-name').value.trim();
  const err=document.getElementById('join-error'); err.textContent='';
  if(!code||!name){ err.textContent='Fyll i kod och namn!'; return; }
  const existing=await readRoom(code);
  if(!existing){ err.textContent='Rummet finns inte.'; return; }
  playerId=newId();
  const avatar=pickRandom(AVATARS);
  const ok=await updateRoom(code, s=>{ s.players.push({id:playerId,name,avatar,score:0,combo:0}); return s; });
  if(!ok){ err.textContent='Något gick fel, försök igen.'; return; }
  playerCode=code;
  document.getElementById('player-name-tag').textContent=avatar+' '+name;
  show('player-game-screen');
  playerPollTimer=setInterval(playerPoll,1000);
  playerPoll();
});

async function playerPoll(){
  const state=await readRoom(playerCode); if(!state) return;
  const idle=document.getElementById('player-idle-view');
  const roundView=document.getElementById('player-round-view');
  const endView=document.getElementById('player-roundend-view');
  [idle,roundView,endView].forEach(v=>v.classList.add('hidden'));

  if(state.phase==='lobby'){
    idle.classList.remove('hidden');
    document.getElementById('player-status-text').textContent='Väntar på läraren...';
  } else if(state.phase==='active' && state.round){
    roundView.classList.remove('hidden');
    renderMiniLB(document.getElementById('player-mini-lb'),state);
    const key=state.round.type+':'+(state.round.word||state.round.statement||state.round.title||JSON.stringify(state.round.correctOrder))+':'+state.planIndex;
    if(playerRenderedRoundKey!==key){ playerRenderedRoundKey=key; renderPlayerRound(state); }
    else if(state.round.type==='draw' && state.round.drawerId!==playerId){
      redrawCanvas(document.getElementById('player-canvas'),state.round.strokes);
      document.getElementById('player-guess-status').textContent =
        (state.round.correctPlayerIds||[]).includes(playerId) ? 'Rätt! Väntar...' : '';
    }
  } else if(state.phase==='round-end'){
    endView.classList.remove('hidden');
    const res=state.lastRoundResult;
    const gained = res ? (res.pointsThisRound[playerId]||0) : 0;
    const t=document.getElementById('roundend-player-text');
    t.className='result-flash '+(gained>0?'correct':'wrong');
    t.textContent = gained>0 ? ('+'+gained+' poäng!') : (res ? res.reveal : '');
  } else if(state.phase==='finished'){
    endView.classList.remove('hidden');
    document.getElementById('roundend-player-text').className='result-flash correct';
    document.getElementById('roundend-player-text').textContent='Spelet är slut! 🏆';
  }
}

function renderPlayerRound(state){
  const r=state.round;
  const body=document.getElementById('round-content-player');
  const isDrawer = r.type==='draw' && r.drawerId===playerId;

  if(r.type==='draw'){
    if(isDrawer){
      drawState={color:'#12314F',size:4,strokes:[],currentStroke:null,lastSync:0};
      body.innerHTML=`<div class="round-type-label"><span class="msi">brush</span> Du ritar: ${r.word}</div>
        <canvas class="draw-canvas" id="player-canvas" width="560" height="340"></canvas>
        <div class="brush-row">
          <div class="swatch active" style="background:#12314F" data-color="#12314F"></div>
          <div class="swatch" style="background:#E05252" data-color="#E05252"></div>
          <div class="swatch" style="background:#1A6DB0" data-color="#1A6DB0"></div>
          <div class="swatch" style="background:#3AA65B" data-color="#3AA65B"></div>
          <button class="tool-btn" id="thin-btn">Tunn</button>
          <button class="tool-btn" id="thick-btn">Tjock</button>
          <button class="tool-btn" id="clear-btn">Rensa</button>
        </div>
        <div class="status-line" id="drawer-status">0 har gissat rätt</div>`;
      setupCanvasDrawing();
    } else {
      body.innerHTML=`<div class="word-hint">${'_ '.repeat(r.wordLength)}</div>
        <canvas class="draw-canvas" id="player-canvas" width="560" height="340"></canvas>
        <input id="guess-input" placeholder="Skriv ditt gissning...">
        <button class="primary-btn" id="guess-submit-btn">Gissa</button>
        <div class="status-line" id="player-guess-status"></div>`;
      redrawCanvas(document.getElementById('player-canvas'),r.strokes);
      document.getElementById('guess-submit-btn').addEventListener('click', submitGuess);
      document.getElementById('guess-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitGuess(); });
    }
  } else if(r.type==='truefalse'){
    body.innerHTML=`<div class="statement-text">"${r.statement}"</div>
      <div class="tf-row">
        <button class="tf-btn true" id="tf-true-btn">Rätt</button>
        <button class="tf-btn false" id="tf-false-btn">Fel</button>
      </div>
      <div class="status-line" id="tf-status"></div>`;
    document.getElementById('tf-true-btn').addEventListener('click', ()=>submitAnswer(true));
    document.getElementById('tf-false-btn').addEventListener('click', ()=>submitAnswer(false));
  } else if(r.type==='wordorder'){
    wordOrderLocal=[];
    body.innerHTML=`<h2 style="font-size:1.1rem;">Bygg meningen</h2>
      <div class="build-row" id="build-row"></div>
      <div class="chip-row" id="chip-row"></div>
      <button class="primary-btn" id="wo-submit-btn">Skicka</button>
      <button class="tool-btn" id="wo-clear-btn" style="margin-top:.6rem;">Rensa</button>
      <div class="status-line" id="wo-status"></div>`;
    renderChips(r.scrambled);
    document.getElementById('wo-submit-btn').addEventListener('click', ()=>submitAnswer(wordOrderLocal.slice()));
    document.getElementById('wo-clear-btn').addEventListener('click', ()=>{ wordOrderLocal=[]; renderChips(r.scrambled); });
  } else if(r.type==='sign'){
    body.innerHTML = renderSignHTML(r) +
      `<div class="statement-text" style="font-size:1.1rem;">${r.question}</div>
      <div class="choice-col" id="sign-choices"></div>
      <div class="status-line" id="sign-status"></div>`;
    const wrap=document.getElementById('sign-choices');
    r.choices.forEach(c=>{
      const btn=document.createElement('button');
      btn.className='choice-btn'; btn.textContent=c;
      btn.addEventListener('click', ()=>submitAnswer(c));
      wrap.appendChild(btn);
    });
  }
}
function renderChips(words){
  const chipRow=document.getElementById('chip-row');
  const buildRow=document.getElementById('build-row');
  chipRow.innerHTML=''; buildRow.innerHTML='';
  words.forEach((w,i)=>{
    const chip=document.createElement('span');
    chip.className='chip'+(wordOrderLocal.includes(w)&&countOcc(wordOrderLocal,w)>=countUpTo(words,w,i)?'':'');
    chip.textContent=w;
    chip.dataset.idx=i;
    chip.addEventListener('click', ()=>{
      if(chip.classList.contains('used')) return;
      chip.classList.add('used');
      wordOrderLocal.push(w);
      const b=document.createElement('span'); b.className='chip'; b.textContent=w;
      buildRow.appendChild(b);
    });
    chipRow.appendChild(chip);
  });
}
function countOcc(arr,w){return arr.filter(x=>x===w).length;}
function countUpTo(arr,w,idx){let c=0;for(let i=0;i<=idx;i++) if(arr[i]===w) c++; return c;}

function setupCanvasDrawing(){
  const canvas=document.getElementById('player-canvas');
  const ctx=canvas.getContext('2d');
  let drawing=false;
  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(clientX-rect.left)/rect.width, y:(clientY-rect.top)/rect.height};
  }
  function start(e){ e.preventDefault(); drawing=true;
    drawState.currentStroke={points:[getPos(e)],color:drawState.color,size:drawState.size};
    drawState.strokes.push(drawState.currentStroke); redrawCanvas(canvas,drawState.strokes);
  }
  function move(e){ if(!drawing) return; e.preventDefault();
    drawState.currentStroke.points.push(getPos(e)); redrawCanvas(canvas,drawState.strokes);
    const now=Date.now();
    if(now-drawState.lastSync>350){ drawState.lastSync=now; syncStrokes(); }
  }
  function end(e){ if(!drawing) return; drawing=false; syncStrokes(); }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});

  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active'); drawState.color=sw.dataset.color;
    });
  });
  document.getElementById('thin-btn').addEventListener('click', ()=>drawState.size=4);
  document.getElementById('thick-btn').addEventListener('click', ()=>drawState.size=10);
  document.getElementById('clear-btn').addEventListener('click', ()=>{
    drawState.strokes=[]; redrawCanvas(canvas,[]); syncStrokes();
  });

  setInterval(async ()=>{
    const state=await readRoom(playerCode);
    if(state && state.round && state.round.type==='draw'){
      const count=(state.round.correctPlayerIds||[]).length;
      const total=state.players.length-1;
      const st=document.getElementById('drawer-status');
      if(st) st.textContent=count+' av '+total+' har gissat rätt';
    }
  },1200);
}
async function syncStrokes(){
  await updateRoom(playerCode, s=>{
    if(s.phase==='active' && s.round && s.round.type==='draw' && s.round.drawerId===playerId){
      s.round.strokes=drawState.strokes;
    }
    return s;
  });
}

async function submitGuess(){
  const input=document.getElementById('guess-input');
  const val=input.value.trim(); if(!val) return;
  input.disabled=true; document.getElementById('guess-submit-btn').disabled=true;
  await updateRoom(playerCode, s=>{
    if(s.phase!=='active' || !s.round || s.round.type!=='draw') return s;
    const r=s.round;
    if((r.correctPlayerIds||[]).includes(playerId)) return s;
    const correct = val.toLowerCase()===r.word.toLowerCase();
    const player=s.players.find(p=>p.id===playerId);
    if(correct){
      const dur=ROUND_DURATIONS.draw;
      const timeLeft=Math.max(0,dur-(Date.now()-r.startedAt)/1000);
      const pts=calcScore(timeLeft/dur, player.combo||0);
      player.score+=pts; player.combo=(player.combo||0)+1;
      r.correctPlayerIds=(r.correctPlayerIds||[]).concat(playerId);
      r.answers=r.answers||{}; r.answers[playerId]={value:val,correct:true,points:pts};
    }
    return s;
  });
  const status=document.getElementById('player-guess-status');
  if(status) status.textContent='Skickat! Väntar...';
}

async function submitAnswer(value){
  document.querySelectorAll('.tf-btn,.choice-btn').forEach(b=>b.disabled=true);
  await updateRoom(playerCode, s=>{
    if(s.phase!=='active' || !s.round) return s;
    const r=s.round;
    r.answers=r.answers||{};
    if(r.answers[playerId]) return s;
    let correct=false;
    if(r.type==='truefalse') correct = value===r.isTrue;
    else if(r.type==='wordorder') correct = JSON.stringify(value)===JSON.stringify(r.correctOrder);
    else if(r.type==='sign') correct = value===r.correct;
    const player=s.players.find(p=>p.id===playerId);
    const dur=ROUND_DURATIONS[r.type];
    const timeLeft=Math.max(0,dur-(Date.now()-r.startedAt)/1000);
    if(correct){
      const pts=calcScore(timeLeft/dur, player.combo||0);
      player.score+=pts; player.combo=(player.combo||0)+1;
      r.answers[playerId]={value,correct:true,points:pts};
    } else {
      r.answers[playerId]={value,correct:false,points:0};
    }
    return s;
  });
  const st=document.getElementById('tf-status')||document.getElementById('wo-status')||document.getElementById('sign-status');
  if(st) st.textContent='Skickat! Väntar på övriga...';
}
</script>
