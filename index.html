<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpråkStudio Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{
  --accent:#2B7DE0; --accent-dark:#195CA8; --accent-light:#EAF2FC;
  --yellow:#FFC72C; --yellow-dark:#8A6200; --yellow-border:#E8B000;
  --bg:#F3F6FA; --card:#FFFFFF; --border:#DCE6F2;
  --ink:#233246; --muted:#7C8CA0;
  --green:#2E9E52; --red:#D9534F;
}
*{box-sizing:border-box;}

/* УВЕЛИЧЕННЫЙ МАСШТАБ СТРАНИЦЫ (18px вместо стандартных 16px) */
html{font-size: 18px;} 

html,body{margin:0;padding:0;min-height:100%;font-family:'Nunito',sans-serif;
  background:var(--bg); color:var(--ink); -webkit-user-select:none; user-select:none; overflow-x:hidden;}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 3vw;}
.hidden{display:none !important;}
.msi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 40;vertical-align:middle;line-height:1;}
h1{font-family:'Fredoka',sans-serif;color:var(--accent-dark);font-size:clamp(1.6rem,3.4vw,2.4rem);margin:0 0 .2em;font-weight:600;}
h2{font-family:'Fredoka',sans-serif;color:var(--ink);font-size:clamp(1.2rem,2.1vw,1.6rem);margin:.2em 0;font-weight:600;}
p.sub{color:var(--muted);font-weight:600;margin-top:0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 4px rgba(20,40,70,.06);
  padding:3vh 3vw;width:min(560px,92vw);text-align:center; position:relative;}
.role-row{display:flex;gap:1.2rem;margin-top:1.8rem;justify-content:center;flex-wrap:wrap;}
.role-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;background:var(--card);color:var(--ink);
  border:1px solid var(--border);border-radius:16px;padding:1.6rem 2rem;cursor:pointer;box-shadow:0 1px 4px rgba(20,40,70,.06);
  display:flex;flex-direction:column;align-items:center;gap:.4rem;transition:transform 0.1s;}
.role-btn:active{background:var(--accent-light);transform:scale(0.96);}
.role-btn .msi{font-size:2.4rem;color:var(--accent);}
input{font-family:'Nunito',sans-serif;font-weight:700;font-size:1.1rem;padding:.75rem 1rem;border-radius:10px;
  border:2px solid var(--border);width:100%;margin-top:.6rem;text-align:center;background:#fff;color:var(--ink);transition:border 0.2s;}
input:focus{outline:none;border-color:var(--accent);}
.primary-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;background:var(--accent);color:#fff;
  border:none;border-radius:10px;padding:.75rem 1.6rem;cursor:pointer;margin-top:1.1rem;transition:transform 0.1s, opacity 0.2s;}
.primary-btn:active{background:var(--accent-dark);transform:scale(0.96);}
.primary-btn:disabled{opacity:.4;pointer-events:none;}
.ghost-btn{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:1px solid var(--border);color:var(--muted);
  border-radius:10px;padding:.6em 1.2em;cursor:pointer;font-size:.95rem;transition:background 0.2s;}
.cancel-btn{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:1px solid var(--red);color:var(--red);
  border-radius:10px;padding:.5em 1em;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:.3em;}
.cancel-btn:active{background:#FBE7E6;}
.board-wrap{width:min(1150px,95vw);}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2vh;gap:1rem;}
.room-pill{background:var(--accent-light);color:var(--accent-dark);font-family:'Fredoka',sans-serif;font-weight:700;
  border-radius:10px;padding:.4em 1em;font-size:1rem;letter-spacing:.06em;}
.avatars{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:1vh;}
.avatar-pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:.35em .8em;display:flex;
  align-items:center;gap:.35em;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;animation:popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
@keyframes popIn{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}
.avatar-pill.is-drawer{background:var(--accent);color:#fff;border-color:var(--accent);}
.score{color:var(--accent-dark);font-weight:800;}
.avatar-pill.is-drawer .score{color:#fff;}
.lobby-code-wrap{text-align:center;width:100%;}
.code-display-big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(4.5rem,15vw,10rem);letter-spacing:.1em;
  color:var(--accent-dark);line-height:1;margin:1vh 0;}
.mini-leaderboard{position:absolute;top:1.2vh;right:1.2vw;background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:.6em .9em;color:var(--ink);font-family:'Fredoka',sans-serif;font-size:.9rem;z-index:5;}
.mini-leaderboard div{display:flex;justify-content:space-between;gap:1em;padding:.12em 0;}
.mini-leaderboard .lb-score{color:var(--accent-dark);font-weight:700;}
.round-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:3vh 3vw;width:100%;
  text-align:center;position:relative;}
.timer-bar-wrap{width:100%;height:10px;background:var(--accent-light);border-radius:999px;overflow:hidden;margin-bottom:1.4vh;}
.timer-bar{height:100%;background:var(--yellow);border-radius:999px;transition:width 0.6s linear;}
.round-type-label{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--accent-dark);font-size:.95rem;
  margin-bottom:.3em;display:flex;align-items:center;justify-content:center;gap:.3em;}
.word-hint{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.4rem);letter-spacing:.22em;
  color:var(--ink);}
canvas.draw-canvas{background:#fff;border:1px solid var(--border);border-radius:12px;touch-action:none;
  width:100%;max-width:560px;height:min(340px,42vh);}
.brush-row{display:flex;gap:.5rem;align-items:center;justify-content:center;margin-top:1rem;flex-wrap:wrap;}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform 0.1s;}
.swatch:active{transform:scale(0.9);}
.swatch.active{border-color:var(--accent);transform:scale(1.1);}
.tool-btn{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:1px solid var(--accent);color:var(--accent);
  border-radius:10px;padding:.4em .8em;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:.25em;}
.tool-btn.active{background:var(--accent);color:#fff;}
.statement-text{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(1.1rem,2.2vw,1.5rem);color:var(--ink);
  margin:1rem 0 1.3rem;}
.tf-row{display:flex;gap:1rem;justify-content:center;}
.tf-btn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;border:none;border-radius:12px;
  padding:1em 2em;cursor:pointer;color:#fff;transition:transform 0.1s, opacity 0.2s;}
.tf-btn:active{transform:scale(0.95);}
.tf-btn.true{background:var(--green);}
.tf-btn.false{background:var(--red);}
.tf-btn:disabled{opacity:.4;pointer-events:none;}
.drag-row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin:1.2rem 0;min-height:3.6em;touch-action:none;}
.drag-chip{font-family:'Nunito',sans-serif;font-weight:800;background:var(--yellow);border:2px solid var(--yellow-border);
  color:var(--ink);border-radius:12px;padding:.7em 1.1em;cursor:grab;font-size:1.1rem;touch-action:none;
  user-select:none;position:relative;}
.drag-chip.jiggle{animation:jiggle .26s ease-in-out infinite;}
.drag-chip.jiggle-soft{animation:jiggle-soft .5s ease-in-out infinite;}
@keyframes jiggle-soft{0%,100%{transform:rotate(-1deg);}50%{transform:rotate(1deg);}}
.drag-chip.dragging{opacity:.92;transform:scale(1.12) !important;z-index:20;box-shadow:0 8px 18px rgba(0,0,0,.25);
  animation:none;cursor:grabbing;}
@keyframes jiggle{0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
.sign-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.1em 1.3em;margin:1rem auto;
  max-width:360px;text-align:left;font-family:'Nunito',sans-serif;}
.sign-box .sign-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.05rem;color:var(--accent-dark);
  display:flex;align-items:center;gap:.4em;margin-bottom:.4em;}
.sign-box .sign-line{font-size:.98rem;color:var(--ink);padding:.15em 0;}
.choice-col{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem;max-width:400px;margin-left:auto;margin-right:auto;}
.choice-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:1rem;background:#fff;border:2px solid var(--accent);
  color:var(--ink);border-radius:12px;padding:.8em 1.1em;cursor:pointer;transition:background 0.1s, color 0.1s;}
.choice-btn:active{background:var(--accent);color:#fff;}
.choice-btn:disabled{opacity:.4;pointer-events:none;}
.match-columns{display:flex;gap:2.4rem;justify-content:center;margin:1.2rem auto;max-width:420px;}
.match-col{display:flex;flex-direction:column;gap:.6rem;flex:1;}
.match-tile{font-family:'Nunito',sans-serif;font-weight:700;background:#FFFDF7;border:2px dashed var(--accent);color:var(--ink);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:.65em .6em;cursor:pointer;width:100%;min-height:2.6em;
  text-align:center;font-size:1.05rem;display:flex;align-items:center;justify-content:center;
  transition:transform .1s ease;box-shadow:1px 2px 0 rgba(35,50,70,.08);}
.match-tile:active{transform:scale(.96);}
.match-tile.selected{background:var(--accent);color:#fff;border-color:var(--accent-dark);border-style:solid;}
.match-tile.matched{background:#E7F5EA;border-color:var(--green);border-style:solid;color:var(--green);opacity:.55;pointer-events:none;}
.status-line{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--muted);margin-top:.5rem;font-size:.92rem;}
.status-line.almost{color:var(--yellow-dark);}
.status-line.wrong{color:var(--red);}
.status-line.right{color:var(--green);}
.result-flash{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;margin-top:.7rem;}
.result-flash.correct{color:var(--green); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
.result-flash.wrong{color:var(--red);}
.leaderboard-table{width:100%;border-collapse:collapse;margin-top:1rem;}
.leaderboard-table td{padding:.45em .3em;font-family:'Nunito',sans-serif;font-weight:700;text-align:left;border-bottom:1px solid var(--border);}
.leaderboard-table .rank{font-family:'Fredoka',sans-serif;color:var(--accent);width:2em;}
.leaderboard-table .delta-up{color:var(--green);}
.leaderboard-table .delta-down{color:var(--red);}
.leaderboard-table .gained{color:var(--accent-dark);font-family:'Fredoka',sans-serif;}

/* EPIC FULLSCREEN PODIUM STYLES */
#host-finished-view {
  position: fixed !important; /* Делаем на весь экран! */
  top: 0; left: 0;
  width: 100vw !important;
  height: 100vh !important;
  max-width: 100% !important; /* Сбрасываем ограничение .card */
  border-radius: 0 !important;
  margin: 0 !important;
  background: linear-gradient(135deg, #ffffff, #f0f4f8);
  border: none;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#host-finished-view::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('jarven.png') center/cover no-repeat;
  opacity: 0.12; /* Чуть виднее */
  z-index: 0;
  pointer-events: none;
}
#host-finished-view > * {
  position: relative;
  z-index: 1; /* Контент поверх фона */
}

/* Огромный пьедестал */
.podium{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:2rem;
  margin: 8vh 0 6vh;
  transform: scale(1.35); /* Скейл вверх */
  transform-origin: center bottom;
}
.podium-slot{
  border-radius:16px 16px 0 0;padding:1rem;text-align:center;
  font-family:'Fredoka',sans-serif;font-weight:700;color:var(--ink);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  position: relative;
  width: 140px;
  animation: podiumRise 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
}
@keyframes podiumRise {
  0% { transform: translateY(150px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

.podium-slot .podium-avatar { 
  font-size: 3.8rem; 
  margin-top: -60px; /* Вылезает за пределы пьедестала */
  margin-bottom: 5px; 
  position:relative; 
  z-index:2; 
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
}
.podium-slot .podium-name { 
  background: rgba(255,255,255,0.95); 
  color: #233246;
  padding: 0.3rem 0.6rem; 
  border-radius: 10px; 
  font-size: 1.15rem; 
  display:inline-block; 
  margin-top:0.5rem; 
  width:100%; 
  overflow:hidden; 
  text-overflow:ellipsis;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.podium-slot .podium-score { 
  color: rgba(255,255,255,1); 
  font-size: 1.5rem; 
  margin-top: 0.6rem;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.podium-slot.p1{height:260px;background:linear-gradient(180deg, #FFD000, #FF7B00); color:#fff; animation-delay: 0.6s;}
.podium-slot.p2{height:200px;background:linear-gradient(180deg, #00B4D8, #0077B6); animation-delay: 0.3s;}
.podium-slot.p3{height:160px;background:linear-gradient(180deg, #52B788, #2D6A4F); animation-delay: 0s;}

.crown { 
  position:absolute; 
  top:-110px; /* Над аватаркой */
  left:50%; 
  transform:translateX(-50%); 
  font-size:4.5rem; 
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); 
  animation: crownDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; 
  animation-delay: 1.2s; 
}
@keyframes crownDrop { 0% { transform: translate(-50%, -80px) scale(0); opacity:0;} 100% { transform: translate(-50%, 0) scale(1); opacity:1;} }

.player-idle{text-align:center;}
.player-idle .big-emoji{font-size:3.2rem;color:var(--accent); animation: pulse 1.3s infinite ease-in-out;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

#confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="app">

<div id="role-screen">
  <h1>🇸🇪 SpråkStudio Party</h1>
  <p class="sub">Vem är du?</p>
  <div class="role-row">
    <button class="role-btn" id="host-role-btn"><span class="msi">desktop_windows</span>Lärare<br>(smartboard)</button>
    <button class="role-btn" id="player-role-btn"><span class="msi">tablet_mac</span>Elev<br>(iPad)</button>
  </div>
</div>

<div id="host-create-screen" class="hidden">
  <div class="card"><h2>Skapa ett rum</h2>
    <button class="primary-btn" id="create-room-btn">Skapa rum</button>
  </div>
</div>

<div id="host-board-screen" class="hidden board-wrap" style="position:relative;">
  <div class="top-bar">
    <div class="room-pill hidden" id="host-room-code">KOD: ----</div>
    <div style="display:flex;gap:.6rem;">
      <button class="ghost-btn" id="mute-btn"><span class="msi">volume_up</span></button>
      <button class="cancel-btn" id="cancel-room-btn"><span class="msi">cancel</span> Avbryt rummet</button>
    </div>
  </div>
  <div class="avatars hidden" id="host-avatars"></div>

  <div id="host-lobby-view" class="lobby-code-wrap">
    <p class="sub">Rumskod</p>
    <div class="code-display-big" id="lobby-code-big">----</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:1.2rem;flex-wrap:wrap;margin-bottom:1rem;">
      <div>
        <p class="sub" style="margin-bottom:.3em;">Gå till</p>
        <p style="font-family:'Fredoka',sans-serif;font-weight:700;color:var(--accent-dark);font-size:1.2rem;margin:0;">sprakstudio.vercel.app</p>
      </div>
      <img id="lobby-qr" src="" alt="QR" style="width:110px;height:110px;border-radius:10px;border:1px solid var(--border);">
    </div>
    <div class="avatars" id="lobby-avatars-big"></div>
    <button class="primary-btn" id="start-game-btn" disabled>Starta spelet</button>
  </div>

  <div id="host-round-view" class="hidden" style="position:relative;width:100%;">
    <div class="mini-leaderboard" id="host-mini-lb"></div>
    <div class="round-card">
      <div class="round-type-label" id="round-type-label"></div>
      <div class="status-line" id="round-counter" style="margin-bottom:.6em;"></div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="host-timer-bar" style="width:100%;"></div></div>
      <div id="round-content-host"></div>
    </div>
  </div>
  <div id="host-roundend-view" class="hidden card" style="width:100%;">
    <h2 id="roundend-title">Rundan är slut!</h2>
    <p class="sub" id="roundend-reveal"></p>
    <canvas id="roundend-drawing" class="draw-canvas hidden" width="400" height="240" style="max-width:280px;height:170px;margin:0 auto 1rem;display:block;"></canvas>
    <table class="leaderboard-table" id="roundend-table"></table>
    <button class="primary-btn hidden" id="next-round-btn">Nästa runda</button>
  </div>
  
  <!-- ФИНАЛЬНЫЙ ЭКРАН ХОСТА (ПОЛНОЭКРАННЫЙ) -->
  <div id="host-finished-view" class="hidden">
    <h2 style="font-size: 4rem; margin-bottom: 0;">🏆 Spelet är slut!</h2>
    <p class="sub" style="margin-bottom: 0.5rem; font-size: 1.8rem; color: #555;">Bra jobbat allihopa!</p>
    <div class="podium" id="podium"></div>
    <button class="primary-btn" id="add-rounds-btn" style="background:var(--yellow);color:var(--ink); margin-top:3rem; position:relative; z-index:2; font-size: 1.2rem; padding: 1rem 2rem;"><span class="msi">add_circle</span> Spela mer (20 rundor till)</button>
  </div>
</div>

<div id="player-join-screen" class="hidden">
  <div class="card"><h2>Gå med i rummet</h2>
    <input id="join-code" placeholder="KOD" maxlength="4" style="text-transform:uppercase;">
    <input id="join-name" placeholder="Ditt namn" maxlength="16">
    <button class="primary-btn" id="join-btn">Gå med</button>
    <div id="join-error" style="color:var(--red);font-weight:700;margin-top:.5rem;"></div>
  </div>
</div>

<div id="player-game-screen" class="hidden" style="width:min(480px,94vw);">
  <div class="card" style="width:100%;">
    <div id="player-idle-view" class="player-idle">
      <div class="big-emoji msi">hourglass_top</div>
      <div class="player-name-tag" id="player-name-tag"></div>
      <p class="sub" id="player-status-text">Väntar på läraren...</p>
    </div>
    <div id="player-round-view" class="hidden">
      <div class="mini-leaderboard" id="player-mini-lb" style="position:static;display:inline-block;margin-bottom:1rem;"></div>
      <div id="round-content-player"></div>
    </div>
    <div id="player-roundend-view" class="hidden player-idle">
      <div class="big-emoji msi" id="roundend-player-icon" style="margin-bottom:0.5rem; display:inline-block;">emoji_events</div>
      <div id="roundend-player-text" class="result-flash"></div>
      <p class="sub" id="roundend-player-sub">Väntar på läraren...</p>
    </div>
  </div>
</div>

</div>

<script>
// --- CONFETTI SYSTEM ---
const Confetti = (function(){
  let canvas, ctx, particles = [], animating = false;
  const colors = ['#2B7DE0', '#FFC72C', '#2E9E52', '#D9534F', '#FF8C42', '#8A2387'];
  
  function init() {
    canvas = document.getElementById('confetti-canvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
  }
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  
  function shoot() {
    if(!canvas) init();
    for(let i=0; i<150; i++) {
      particles.push({
        x: canvas.width / 2, y: canvas.height + 10,
        vx: (Math.random() - 0.5) * (canvas.width / 40),
        vy: (Math.random() - 1) * 20 - 5,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10,
        tiltAngleInc: (Math.random() * 0.07) + 0.05,
        tiltAngle: 0
      });
    }
    if(!animating) { animating = true; render(); }
  }
  
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    particles.forEach((p, index) => {
      p.tiltAngle += p.tiltAngleInc;
      p.y += (Math.cos(p.tiltAngle) + 1 + p.size / 2) / 2;
      p.x += Math.sin(p.tiltAngle) * 2 + p.vx;
      p.vy += 0.2; // gravity
      p.y += p.vy;
      
      ctx.beginPath();
      ctx.lineWidth = p.size;
      ctx.strokeStyle = p.color;
      ctx.moveTo(p.x + p.tilt + p.size, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.size);
      ctx.stroke();
      
      if(p.y <= canvas.height + 20) active = true;
    });
    
    if(active) requestAnimationFrame(render);
    else { animating = false; particles = []; }
  }
  
  return { shoot };
})();

async function readRoom(code){
  try{const r=await fetch('/api/room?code='+encodeURIComponent(code));if(!r.ok)return null;
    const j=await r.json();return j.value||null;}catch(e){return null;}
}
async function writeRoom(code,state){
  try{const r=await fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code,state})});return r.ok;}catch(e){return false;}
}
async function updateRoom(code,mutateFn,retries=5){
  for(let i=0;i<retries;i++){
    const cur=await readRoom(code); if(!cur) return false;
    const next=mutateFn(JSON.parse(JSON.stringify(cur))); if(!next) return false;
    if(await writeRoom(code,next)) return true;
  }
  return false;
}

function newId(){return Math.random().toString(36).slice(2,10);}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNotEqual(arr){
  if(arr.length<2) return arr.slice();
  let s; do{ s=shuffle(arr); }while(JSON.stringify(s)===JSON.stringify(arr)); return s;
}
function calcScore(timeLeftFraction,combo){
  const base=200+Math.round(800*Math.max(0,Math.min(1,timeLeftFraction)));
  const mult=1+0.1*Math.min(combo,5); return Math.round(base*mult);
}
function normalizeSwedish(s){ return s.toLowerCase().trim().replace(/å|ä/g,'a').replace(/ö/g,'o'); }
function similarity(a,b){
  const m=a.length,n=b.length; if(m===0) return n===0?1:0; if(n===0) return 0;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i; for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const maxLen=Math.max(m,n); return maxLen===0?1:1-dp[m][n]/maxLen;
}

const AudioEngine=(function(){
  let ctx=null, musicOn=true, musicTimer=null, masterGain=null, musicGain=null, sfxGain=null, musicStep=0, musicStartTime=0;
  let finaleBuffers = [];
  const FINALE_URLS = ['audio/sound1.mp3', 'audio/sound2.mp3', 'audio/sound3.mp3', 'audio/sound4.mp3'];

  const SECTIONS=[
    { bass:[130.81,130.81,164.81,146.83], arp:[261.63,329.63,392.00,329.63], lead:[523.25,0,659.25,587.33] },
    { bass:[174.61,174.61,196.00,220.00], arp:[349.23,440.00,523.25,440.00], lead:[698.46,0,880.00,783.99] }
  ];
  
  function ensureCtx(){
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=ctx.createGain(); masterGain.gain.value=0.9; masterGain.connect(ctx.destination);
      musicGain=ctx.createGain(); musicGain.gain.value=0.16; musicGain.connect(masterGain);
      sfxGain=ctx.createGain(); sfxGain.gain.value=0.55; sfxGain.connect(masterGain);
    }
    if(ctx.state==='suspended') ctx.resume();
  }

  async function preloadFinale() {
    ensureCtx();
    for (const url of FINALE_URLS) {
      try {
        const res = await fetch(url);
        const arrayBuf = await res.arrayBuffer();
        const audioBuf = await ctx.decodeAudioData(arrayBuf);
        finaleBuffers.push(audioBuf);
      } catch(e) { console.warn('Kunde inte ladda ' + url); }
    }
  }

  function tone(freq,start,dur,type,gainNode,vol){
    const osc=ctx.createOscillator(); const g=ctx.createGain();
    osc.type=type||'square'; osc.frequency.value=freq;
    g.gain.setValueAtTime(0,start);
    g.gain.linearRampToValueAtTime(vol||0.3,start+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    osc.connect(g); g.connect(gainNode);
    osc.start(start); osc.stop(start+dur+0.02);
  }

  function scheduleMusicStep(){
    if(!musicOn||!ctx) return;
    const sectionIdx = Math.floor(musicStep / 8) % SECTIONS.length;
    const sec = SECTIONS[sectionIdx];
    const t=ctx.currentTime+0.04; const stepDur=0.22;
    tone(sec.bass[musicStep%sec.bass.length],t,stepDur*0.9,'triangle',musicGain,0.5);
    tone(sec.arp[musicStep%sec.arp.length],t,stepDur*0.5,'square',musicGain,0.14);
    musicStep++;
  }

  return {
    ensureCtx, preloadFinale,
    startMusic(){ ensureCtx(); if(!musicTimer){ musicGain.gain.value=0.16; musicStartTime=ctx.currentTime; musicTimer=setInterval(scheduleMusicStep,220); } },
    stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } },
    toggleMusic(){ musicOn=!musicOn; if(musicOn) this.startMusic(); else this.stopMusic(); return musicOn; },
    
    // Эту функцию теперь вызывает ТОЛЬКО хост (экран учителя)
    playHostFinaleSequence(){
      ensureCtx();
      if(!musicOn) return;
      // Fade out 8-bit music
      musicGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.5);
      setTimeout(()=>this.stopMusic(), 3000);
      
      if(finaleBuffers.length > 0) {
        const buf = pickRandom(finaleBuffers);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        
        const finalGain = ctx.createGain();
        finalGain.gain.setValueAtTime(0, ctx.currentTime);
        finalGain.gain.linearRampToValueAtTime(1, ctx.currentTime + 2.5); // Smooth crossfade 2.5s
        
        src.connect(finalGain);
        finalGain.connect(masterGain);
        src.start(0);
      } else {
        // Fallback jingle if mp3s failed
        const t=ctx.currentTime;
        [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>tone(f,t+i*0.13,0.5,'square',sfxGain,0.35));
      }
    },

    playVictory(){ ensureCtx(); const t=ctx.currentTime; [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*0.13,0.4,'square',sfxGain,0.35)); },
    playCorrect(){ ensureCtx(); const t=ctx.currentTime; tone(523.25,t,0.12,'square',sfxGain,0.35); tone(659.25,t+0.1,0.12,'square',sfxGain,0.35); },
    playWrong(){ ensureCtx(); const t=ctx.currentTime; tone(196,t,0.25,'sawtooth',sfxGain,0.28); tone(146.83,t+0.12,0.28,'sawtooth',sfxGain,0.28); },
    playAlmost(){ ensureCtx(); const t=ctx.currentTime; tone(392,t,0.15,'triangle',sfxGain,0.3); tone(440,t+0.1,0.18,'triangle',sfxGain,0.3); },
    playTick(){ ensureCtx(); tone(880,ctx.currentTime,0.06,'square',sfxGain,0.2); },
    playReveal(){ ensureCtx(); const t=ctx.currentTime; [523.25,659.25,783.99].forEach((f,i)=>tone(f,t+i*0.09,0.3,'triangle',sfxGain,0.3)); },
    playJoin(){ ensureCtx(); const t=ctx.currentTime; tone(440,t,0.08,'sine',sfxGain,0.25); tone(660,t+0.06,0.1,'sine',sfxGain,0.25); }
  };
})();

function buildRound(type,drawerId){
  if(type==='draw'){
    const cat=DRAW_CATEGORIES[pickRandom(Object.keys(DRAW_CATEGORIES))];
    const word=pickRandom(cat.words);
    return {type:'draw',drawerId,word,wordLength:word.length,emoji:cat.emoji,strokes:[],correctPlayerIds:[]};
  }
  if(type==='truefalse'){ const s=pickRandom(STATEMENTS); return {type:'truefalse',statement:s.text,isTrue:s.isTrue}; }
  if(type==='wordorder'){ const words=pickRandom(SENTENCES); return {type:'wordorder',correctOrder:words,scrambled:shuffleNotEqual(words)}; }
  if(type==='sign'){ const s=pickRandom(SIGNS); return {type:'sign',icon:s.icon,title:s.title,lines:s.lines,question:s.question,choices:s.choices,correct:s.correct}; }
  if(type==='match'){ return {type:'match',pairs:shuffle(MATCH_PAIRS_POOL).slice(0,6)}; }
}
function buildPlan(players, count){
  const plan=[]; let i=0;
  while(plan.length<(count||20)){
    plan.push({type:'draw',drawerId:players[i%players.length].id});
    if(plan.length<(count||20)) plan.push({type:pickRandom(NON_DRAW_TYPES)}); i++;
  }
  return plan.slice(0,count||20);
}

async function hostPoll(){
  const state=await readRoom(hostCode); if(!state) return;
  const stateHash = JSON.stringify(state);
  
  // Update timers immediately regardless of deep state changes
  if(state.phase==='active' && state.round){
    const dur=ROUND_DURATIONS[state.round.type];
    const elapsed=(Date.now()-state.round.startedAt)/1000;
    const timeLeft=Math.max(0,dur-elapsed);
    document.getElementById('host-timer-bar').style.width=(100*timeLeft/dur)+'%';
    
    const ceilLeft=Math.ceil(timeLeft);
    if(ceilLeft<=5 && ceilLeft>=1 && ceilLeft!==hostLastTickSecond){ hostLastTickSecond=ceilLeft; AudioEngine.playTick(); }
    
    const doneEarly = state.round.type==='draw'
      ? (state.round.correctPlayerIds||[]).length >= (state.players.length-1) && state.players.length>1
      : Object.keys(state.round.answers||{}).length >= state.players.length;
      
    if((timeLeft<=0 || doneEarly) && hostLastStateHash === stateHash){ 
        await finalizeRound(state); 
        return; 
    }
  }

  // Skip Heavy DOM UI updates if state is identical
  if (stateHash === hostLastStateHash) return;
  hostLastStateHash = stateHash;

  const isLobby = state.phase==='lobby';
  document.getElementById('host-room-code').classList.toggle('hidden', isLobby);
  document.getElementById('host-avatars').classList.toggle('hidden', isLobby);
  
  if(!isLobby) renderAvatars(document.getElementById('host-avatars'),state);
  renderAvatars(document.getElementById('lobby-avatars-big'),state);
  document.getElementById('start-game-btn').disabled = state.players.length<1;
  
  document.getElementById('host-lobby-view').classList.toggle('hidden', state.phase!=='lobby');
  document.getElementById('host-round-view').classList.toggle('hidden', state.phase!=='active');
  document.getElementById('host-roundend-view').classList.toggle('hidden', state.phase!=='round-end');
  document.getElementById('host-finished-view').classList.toggle('hidden', state.phase!=='finished');

  if(state.players.length>hostLastPlayerCount) AudioEngine.playJoin();
  hostLastPlayerCount=state.players.length;

  if(state.phase==='active' && state.round){
    renderMiniLB(document.getElementById('host-mini-lb'),state);
    document.getElementById('round-counter').textContent='Runda '+(state.planIndex+1)+' / '+state.plan.length;
    
    const key=state.round.type+':'+state.planIndex;
    if(hostRenderedRoundKey!==key){
      hostRenderedRoundKey=key; hostLastTickSecond=null;
      renderHostRound(state);
    } else if(state.round.type==='draw'){ 
      redrawCanvas(document.getElementById('host-canvas'),state.round.strokes); 
    }
  }

  if(state.phase==='round-end' && hostLastPhase!=='round-end'){
    renderRoundEnd(state);
    AudioEngine.playReveal();
  }
  
  if(state.phase==='finished' && hostLastPhase!=='finished'){
    renderPodium(state);
    Confetti.shoot();
    // ТОЛЬКО ХОСТ ИГРАЕТ МУЗЫКУ ИЗ MP3 ФАЙЛОВ
    AudioEngine.playHostFinaleSequence(); 
  }
  
  hostLastPhase=state.phase;
}

function redrawCanvas(canvas,strokes){
  if(!canvas) return; const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  (strokes||[]).forEach(s=>{
    if(!s.points||s.points.length<1) return;
    ctx.globalCompositeOperation = s.mode==='eraser' ? 'destination-out' : 'source-over';
    ctx.beginPath(); ctx.strokeStyle=s.color; ctx.lineWidth=s.size; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.moveTo(s.points[0].x*canvas.width,s.points[0].y*canvas.height);
    for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x*canvas.width,s.points[i].y*canvas.height);
    ctx.stroke();
  });
  ctx.globalCompositeOperation='source-over';
}

async function finalizeRound(state){
  const snap=state.round.scoreSnapshot || {};
  const rankBefore=[...state.players].sort((a,b)=>(snap[b.id]||0)-(snap[a.id]||0)).map(p=>p.id);
  await updateRoom(hostCode, s=>{
    if(s.phase!=='active') return s;
    const r=s.round;
    if(r.type==='draw'){
      const drawer=s.players.find(p=>p.id===r.drawerId);
      if(drawer){ drawer.score += 50*(r.correctPlayerIds||[]).length; drawer.combo = (r.correctPlayerIds||[]).length>0 ? (drawer.combo||0)+1 : 0; }
      s.players.forEach(p=>{ if(p.id!==r.drawerId && !(r.correctPlayerIds||[]).includes(p.id)) p.combo=0; });
    } else {
      s.players.forEach(p=>{ if(!(r.answers||{})[p.id]?.correct) p.combo=0; });
    }
    const rankAfter=[...s.players].sort((a,b)=>b.score-a.score).map(p=>p.id);
    const pts={}; s.players.forEach(p=>{ pts[p.id]=p.score-(snap[p.id]||0); });
    
    let reveal='Ordet var: '+r.word;
    if(r.type==='truefalse') reveal = r.isTrue ? 'Sant!' : 'Falskt!';
    if(r.type==='wordorder') reveal = r.correctOrder.join(' ');
    if(r.type==='sign') reveal = 'Rätt svar: '+r.correct;
    if(r.type==='match') reveal = 'Paren: '+r.pairs.map(p=>p.word+' '+p.emoji).join(', ');

    s.lastRoundResult={type:r.type, reveal, rankBefore, rankAfter, pointsThisRound:pts};
    
    // ПРОВЕРКА НА ПОСЛЕДНИЙ РАУНД - СРАЗУ В ФИНАЛ
    const isLastRound = s.planIndex >= s.plan.length - 1;
    s.phase = isLastRound ? 'finished' : 'round-end'; 
    return s;
  });
}

function renderRoundEnd(state){
  const res=state.lastRoundResult;
  document.getElementById('roundend-reveal').textContent = res ? res.reveal : '';
  const drawCanvas=document.getElementById('roundend-drawing');
  if(state.round && state.round.type==='draw'){ drawCanvas.classList.remove('hidden'); redrawCanvas(drawCanvas, state.round.strokes); }
  else { drawCanvas.classList.add('hidden'); }
  
  const table=document.getElementById('roundend-table');
  table.innerHTML = [...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>{
    const b=res.rankBefore.indexOf(p.id), a=res.rankAfter.indexOf(p.id);
    let arrow = b>a ? `<span class="delta-up">▲${b-a}</span>` : (b<a ? `<span class="delta-down">▼${a-b}</span>` : '–');
    return `<tr><td class="rank">#${i+1}</td><td>${p.avatar} ${p.name}</td><td>${arrow}</td>
      <td class="gained">+${res.pointsThisRound[p.id]||0}</td></tr>`;
  }).join('');
  
  document.getElementById('next-round-btn').classList.remove('hidden');
}

function renderPodium(state){
  const sorted=[...state.players].sort((a,b)=>b.score-a.score);
  const el=document.getElementById('podium');
  const slots=[[1,'p2'],[0,'p1'],[2,'p3']]; // Visual order: 2nd, 1st, 3rd
  
  el.innerHTML = slots.filter(([idx])=>sorted[idx]).map(([idx,cls])=>{
    const p=sorted[idx];
    const isFirst = cls === 'p1';
    return `
      <div class="podium-slot ${cls}">
        ${isFirst ? '<div class="crown">👑</div>' : ''}
        <div class="podium-avatar">${p.avatar}</div>
        <div class="podium-name">${p.name}</div>
        <div class="podium-score">${p.score}</div>
      </div>`;
  }).join('');
}

document.getElementById('start-game-btn').addEventListener('click', async ()=>{
  document.getElementById('start-game-btn').disabled = true;
  const state=await readRoom(hostCode);
  await updateRoom(hostCode, s=>{ s.plan=buildPlan(s.players,20); s.planIndex=-1; return s; });
  await advanceRound();
});
document.getElementById('next-round-btn').addEventListener('click', advanceRound);
document.getElementById('add-rounds-btn').addEventListener('click', async ()=>{
  await updateRoom(hostCode, s=>{ s.plan=s.plan.concat(buildPlan(s.players,20)); return s; });
  await advanceRound();
  
  // Возвращаем хоста из экрана финала обратно в режим игры
  document.getElementById('host-finished-view').classList.add('hidden');
  document.getElementById('host-round-view').classList.remove('hidden');
  AudioEngine.startMusic();
});

async function advanceRound(){
  document.getElementById('next-round-btn').disabled = true;
  await updateRoom(hostCode, s=>{
    const idx=s.planIndex+1; if(idx>=s.plan.length) return s;
    const r=buildRound(s.plan[idx].type, s.plan[idx].drawerId);
    r.startedAt=Date.now(); r.answers={};
    const snap={}; s.players.forEach(p=>snap[p.id]=p.score); r.scoreSnapshot=snap;
    s.round=r; s.planIndex=idx; s.phase='active'; return s;
  });
  hostRenderedRoundKey=null;
  document.getElementById('next-round-btn').disabled = false;
}

/* ================= PLAYER LOGIC ================= */
let playerCode=null, playerId=null, playerPollTimer=null, playerRenderedRoundKey=null;
let playerLastStateHash = "";
let wordOrderLocal=[], matchState=null;
let drawState={color:'#233246',size:4,tool:'pen',strokes:[],currentStroke:null,lastSync:0};
let playerLastPhase = null;

document.getElementById('join-btn').addEventListener('click', async ()=>{
  AudioEngine.ensureCtx();
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  const name=document.getElementById('join-name').value.trim();
  const err=document.getElementById('join-error'); err.textContent='';
  if(!code||!name){ err.textContent='Fyll i kod och namn!'; return; }
  
  document.getElementById('join-btn').disabled = true;
  const existing=await readRoom(code);
  if(!existing){ err.textContent='Rummet finns inte.'; document.getElementById('join-btn').disabled = false; return; }
  
  playerId=newId(); const avatar=pickRandom(AVATARS);
  const ok=await updateRoom(code, s=>{ s.players.push({id:playerId,name,avatar,score:0,combo:0}); return s; });
  if(!ok){ err.textContent='Gick inte, försök igen.'; document.getElementById('join-btn').disabled = false; return; }
  
  AudioEngine.playJoin();
  playerCode=code; document.getElementById('player-name-tag').textContent=avatar+' '+name;
  show('player-game-screen');
  playerPollTimer=setInterval(playerPoll, 600); // Snappy polling
  playerPoll();
});

async function playerPoll(){
  const state=await readRoom(playerCode); if(!state) return;
  const hash = JSON.stringify(state);

  const idle=document.getElementById('player-idle-view');
  const roundView=document.getElementById('player-round-view');
  const endView=document.getElementById('player-roundend-view');

  if(state.phase==='cancelled'){
    [roundView,endView].forEach(v=>v.classList.add('hidden')); idle.classList.remove('hidden');
    document.getElementById('player-status-text').textContent='Läraren avslutade rummet.';
    clearInterval(playerPollTimer); return;
  }

  // Live stroke rendering (bypasses hash check)
  if(state.phase==='active' && state.round && state.round.type==='draw' && state.round.drawerId!==playerId){
    redrawCanvas(document.getElementById('player-canvas'),state.round.strokes);
  }

  if (hash === playerLastStateHash) return;
  playerLastStateHash = hash;

  [idle,roundView,endView].forEach(v=>v.classList.add('hidden'));

  if(state.phase==='lobby'){
    idle.classList.remove('hidden');
    document.getElementById('player-status-text').textContent='Väntar på läraren...';
  } else if(state.phase==='active' && state.round){
    roundView.classList.remove('hidden');
    renderMiniLB(document.getElementById('player-mini-lb'),state);
    
    const key=state.round.type+':'+state.planIndex;
    if(playerRenderedRoundKey!==key){ playerRenderedRoundKey=key; renderPlayerRound(state); }
    
    // Check if player has already answered
    if(state.round.type==='draw' && state.round.drawerId!==playerId){
      const gs=document.getElementById('player-guess-status');
      if(gs && (state.round.correctPlayerIds||[]).includes(playerId)){
        gs.textContent='Rätt! Väntar...'; gs.className='status-line right';
        document.getElementById('guess-input').disabled=true;
        document.getElementById('guess-submit-btn').disabled=true;
      }
    }
  } else if(state.phase==='round-end'){
    endView.classList.remove('hidden');
    const res=state.lastRoundResult;
    const gained = res ? (res.pointsThisRound[playerId]||0) : 0;
    const t=document.getElementById('roundend-player-text');
    t.className='result-flash '+(gained>0?'correct':'wrong');
    t.textContent = gained>0 ? ('+'+gained+' poäng!') : (res ? res.reveal : '');
    document.getElementById('roundend-player-sub').textContent = 'Väntar på läraren...';
    document.getElementById('roundend-player-icon').textContent = gained>0 ? 'star' : 'mood_bad';
  } else if(state.phase==='finished'){
    endView.classList.remove('hidden');
    document.getElementById('roundend-player-text').className='result-flash correct';
    document.getElementById('roundend-player-text').textContent='Spelet är slut! 🏆';
    document.getElementById('roundend-player-sub').textContent = 'Bra jobbat!';
    document.getElementById('roundend-player-icon').textContent = 'emoji_events';
    
    if (playerLastPhase !== 'finished') {
        Confetti.shoot(); // Client side celebration
        // ПЛЕЕР ИГРАЕТ ПРОСТО КОРОТКИЙ ПОБЕДНЫЙ ЗВУК, ЧТОБЫ НЕ ПЕРЕБИВАТЬ МУЗЫКУ УЧИТЕЛЯ
        AudioEngine.playVictory(); 
    }
  }

  playerLastPhase = state.phase;
}

function renderPlayerRound(state){
  const r=state.round;
  const body=document.getElementById('round-content-player');
  const isDrawer = r.type==='draw' && r.drawerId===playerId;

  if(r.type==='draw'){
    if(isDrawer){
      drawState={color:'#233246',size:4,tool:'pen',strokes:[],currentStroke:null,lastSync:0};
      body.innerHTML=`<div class="round-type-label"><span class="msi">brush</span> Du ritar: ${r.word}</div>
        <canvas class="draw-canvas" id="player-canvas" width="560" height="340"></canvas>
        <div class="brush-row">
          <div class="swatch active" style="background:#233246" data-color="#233246"></div>
          <div class="swatch" style="background:#D9534F" data-color="#D9534F"></div>
          <div class="swatch" style="background:#2B7DE0" data-color="#2B7DE0"></div>
          <div class="swatch" style="background:#2E9E52" data-color="#2E9E52"></div>
          <div class="swatch" style="background:#FFC72C" data-color="#FFC72C"></div>
          <button class="tool-btn active" id="thin-btn">Tunn</button>
          <button class="tool-btn" id="thick-btn">Tjock</button>
          <button class="tool-btn" id="eraser-btn"><span class="msi">ink_eraser</span>Sudda</button>
          <button class="tool-btn" id="clear-btn">Rensa</button>
        </div>`;
      setupCanvasDrawing();
    } else {
      body.innerHTML=`<div class="word-hint">${'_ '.repeat(r.wordLength)}</div>
        <canvas class="draw-canvas" id="player-canvas" width="560" height="340"></canvas>
        <input id="guess-input" placeholder="Skriv din gissning...">
        <button class="primary-btn" id="guess-submit-btn">Gissa</button>
        <div class="status-line" id="player-guess-status"></div>`;
      redrawCanvas(document.getElementById('player-canvas'),r.strokes);
      document.getElementById('guess-submit-btn').addEventListener('click', submitGuess);
      document.getElementById('guess-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitGuess(); });
    }
  } else if(r.type==='truefalse'){
    body.innerHTML=`<div class="statement-text">"${r.statement}"</div>
      <div class="tf-row">
        <button class="tf-btn true" id="tf-true-btn">Rätt</button>
        <button class="tf-btn false" id="tf-false-btn">Fel</button>
      </div>
      <div class="status-line" id="tf-status"></div>`;
    document.getElementById('tf-true-btn').addEventListener('click', ()=>submitAnswer(true));
    document.getElementById('tf-false-btn').addEventListener('click', ()=>submitAnswer(false));
  } else if(r.type==='wordorder'){
    wordOrderLocal = r.scrambled.slice();
    body.innerHTML=`<h2 style="font-size:1.05rem;">Dra orden i rätt ordning</h2>
      <div class="drag-row" id="drag-row"></div>
      <button class="primary-btn" id="wo-submit-btn">Skicka</button>
      <div class="status-line" id="wo-status"></div>`;
    renderDragChips(document.getElementById('drag-row'), wordOrderLocal);
    document.getElementById('wo-submit-btn').addEventListener('click', ()=>submitAnswer(wordOrderLocal.slice()));
  } else if(r.type==='sign'){
    body.innerHTML = renderSignHTML(r) + `<div class="statement-text" style="font-size:1.05rem;">${r.question}</div><div class="choice-col" id="sign-choices"></div><div class="status-line" id="sign-status"></div>`;
    const wrap=document.getElementById('sign-choices');
    r.choices.forEach(c=>{
      const btn=document.createElement('button'); btn.className='choice-btn'; btn.textContent=c;
      btn.addEventListener('click', ()=>submitAnswer(c)); wrap.appendChild(btn);
    });
  } else if(r.type==='match'){
    matchState={pairs:r.pairs, matchedWords:[], selectedWord:null, selectedEmoji:null, shuffledWords:shuffle(r.pairs.map(p=>p.word)), shuffledEmojis:shuffle(r.pairs.map(p=>p.emoji))};
    body.innerHTML=`<h2 style="font-size:1.05rem;">Para ihop</h2><div class="match-columns"><div class="match-col" id="match-words"></div><div class="match-col" id="match-emojis"></div></div><div class="status-line" id="match-status"></div>`;
    renderMatchColumns();
  }
}

function renderDragChips(container, order){
  container.innerHTML='';
  order.forEach((w)=>{
    const el=document.createElement('div'); el.className='drag-chip jiggle'; el.textContent=w;
    el.style.animationDelay=(Math.random()*0.2).toFixed(2)+'s';
    container.appendChild(el); attachDragHandlers(el, container, order);
  });
}
function attachDragHandlers(el, container, order){
  let dragging=false;
  function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }
  function onDown(e){
    e.preventDefault(); dragging=true; el.classList.add('dragging'); el.classList.remove('jiggle');
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false}); document.addEventListener('touchend', onUp);
  }
  function onMove(e){
    if(!dragging) return; e.preventDefault(); const x=getX(e);
    const children=[...container.children].filter(c=>c!==el); let insertBefore=null;
    for(const child of children){ const rect=child.getBoundingClientRect(); if(x < rect.left+rect.width/2){ insertBefore=child; break; } }
    if(insertBefore) container.insertBefore(el, insertBefore); else container.appendChild(el);
  }
  function onUp(){
    if(!dragging) return; dragging=false; el.classList.remove('dragging'); el.classList.add('jiggle');
    document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp);
    order.length=0; order.push(...[...container.children].map(c=>c.textContent));
  }
  el.addEventListener('mousedown', onDown); el.addEventListener('touchstart', onDown, {passive:false});
}

function renderMatchColumns(){
  const wordsWrap=document.getElementById('match-words'); const emojisWrap=document.getElementById('match-emojis');
  wordsWrap.innerHTML=''; emojisWrap.innerHTML='';
  matchState.shuffledWords.forEach(w=>{
    const el=document.createElement('div'); el.className='match-tile'+(matchState.matchedWords.includes(w)?' matched':'');
    el.textContent=w; el.addEventListener('click', ()=> {
      if(el.classList.contains('matched')) return;
      document.querySelectorAll('#match-words .match-tile').forEach(t=>t.classList.remove('selected'));
      matchState.selectedWord=w; el.classList.add('selected'); tryMatch();
    }); wordsWrap.appendChild(el);
  });
  matchState.shuffledEmojis.forEach(em=>{
    const el=document.createElement('div'); const pair=matchState.pairs.find(p=>p.emoji===em);
    el.className='match-tile'+(matchState.matchedWords.includes(pair.word)?' matched':'');
    el.textContent=em; el.addEventListener('click', ()=> {
      if(el.classList.contains('matched')) return;
      document.querySelectorAll('#match-emojis .match-tile').forEach(t=>t.classList.remove('selected'));
      matchState.selectedEmoji=em; el.classList.add('selected'); tryMatch();
    }); emojisWrap.appendChild(el);
  });
}
function tryMatch(){
  if(!matchState.selectedWord || !matchState.selectedEmoji) return;
  const pair=matchState.pairs.find(p=>p.word===matchState.selectedWord);
  if(pair.emoji===matchState.selectedEmoji){
    matchState.matchedWords.push(matchState.selectedWord);
    matchState.selectedWord=null; matchState.selectedEmoji=null;
    renderMatchColumns();
    if(matchState.matchedWords.length===matchState.pairs.length){ document.getElementById('match-status').textContent='Klart!'; submitAnswer(true); }
  } else {
    document.getElementById('match-status').textContent='Fel par, försök igen';
    setTimeout(()=>{
      matchState.selectedWord=null; matchState.selectedEmoji=null;
      document.querySelectorAll('.match-tile.selected').forEach(t=>t.classList.remove('selected'));
    },450);
  }
}

function setupCanvasDrawing(){
  const canvas=document.getElementById('player-canvas'); let drawing=false;
  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX; const clientY=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(clientX-rect.left)/rect.width, y:(clientY-rect.top)/rect.height};
  }
  function start(e){ e.preventDefault(); drawing=true;
    drawState.currentStroke={points:[getPos(e)],color:drawState.color,size:drawState.tool==='eraser'?22:drawState.size,mode:drawState.tool};
    drawState.strokes.push(drawState.currentStroke); redrawCanvas(canvas,drawState.strokes);
  }
  function move(e){ if(!drawing) return; e.preventDefault();
    drawState.currentStroke.points.push(getPos(e)); redrawCanvas(canvas,drawState.strokes);
    const now=Date.now(); if(now-drawState.lastSync>350){ drawState.lastSync=now; syncStrokes(); }
  }
  function end(e){ if(!drawing) return; drawing=false; syncStrokes(); }
  
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});

  function setActiveTool(btn){ document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active')); sw.classList.add('active');
      drawState.color=sw.dataset.color; drawState.tool='pen'; document.getElementById('eraser-btn').classList.remove('active');
    });
  });
  document.getElementById('thin-btn').addEventListener('click', (e)=>{ drawState.size=4; drawState.tool='pen'; setActiveTool(e.target); });
  document.getElementById('thick-btn').addEventListener('click', (e)=>{ drawState.size=10; drawState.tool='pen'; setActiveTool(e.target); });
  document.getElementById('eraser-btn').addEventListener('click', (e)=>{ drawState.tool='eraser'; setActiveTool(e.currentTarget); });
  document.getElementById('clear-btn').addEventListener('click', ()=>{ drawState.strokes=[]; redrawCanvas(canvas,[]); syncStrokes(); });
}

async function syncStrokes(){
  await updateRoom(playerCode, s=>{
    if(s.phase==='active' && s.round && s.round.type==='draw' && s.round.drawerId===playerId) s.round.strokes=drawState.strokes;
    return s;
  });
}

async function submitGuess(){
  const input=document.getElementById('guess-input'); const btn=document.getElementById('guess-submit-btn');
  const status=document.getElementById('player-guess-status'); const val=input.value.trim(); if(!val) return;
  btn.disabled=true; let resultInfo=null;
  
  await updateRoom(playerCode, s=>{
    if(s.phase!=='active' || !s.round || s.round.type!=='draw') return s;
    const r=s.round;
    if((r.correctPlayerIds||[]).includes(playerId)){ resultInfo={correct:true}; return s; }
    
    const isCorrect = normalizeSwedish(val)===normalizeSwedish(r.word);
    if(isCorrect){
      const player=s.players.find(p=>p.id===playerId);
      const pts=calcScore(Math.max(0,ROUND_DURATIONS.draw-(Date.now()-r.startedAt)/1000)/ROUND_DURATIONS.draw, player.combo||0);
      player.score+=pts; player.combo=(player.combo||0)+1;
      r.correctPlayerIds=(r.correctPlayerIds||[]).concat(playerId);
      r.answers=r.answers||{}; r.answers[playerId]={value:val,correct:true,points:pts};
      resultInfo={correct:true};
    } else {
      resultInfo={correct:false, sim:Math.round(similarity(normalizeSwedish(val),normalizeSwedish(r.word))*100)};
    }
    return s;
  });
  
  btn.disabled=false;
  if(resultInfo.correct){
    status.textContent='Rätt! Väntar...'; status.className='status-line right'; input.disabled=true; btn.disabled=true; AudioEngine.playCorrect();
  } else if(resultInfo.sim>=60){
    status.textContent='Nästan rätt! ('+resultInfo.sim+'%) Försök igen'; status.className='status-line almost'; input.value=''; input.focus(); AudioEngine.playAlmost();
  } else {
    status.textContent='Fel, försök igen'; status.className='status-line wrong'; input.value=''; input.focus(); AudioEngine.playWrong();
  }
}

async function submitAnswer(value){
  document.querySelectorAll('.tf-btn,.choice-btn, .primary-btn').forEach(b=>b.disabled=true);
  let wasCorrect=null;
  await updateRoom(playerCode, s=>{
    if(s.phase!=='active' || !s.round) return s;
    const r=s.round; r.answers=r.answers||{}; if(r.answers[playerId]) return s;
    
    let correct=false;
    if(r.type==='truefalse') correct = value===r.isTrue;
    else if(r.type==='wordorder') correct = JSON.stringify(value)===JSON.stringify(r.correctOrder);
    else if(r.type==='sign') correct = value===r.correct;
    else if(r.type==='match') correct = value===true;
    
    const player=s.players.find(p=>p.id===playerId);
    if(correct){
      const pts=calcScore(Math.max(0,ROUND_DURATIONS[r.type]-(Date.now()-r.startedAt)/1000)/ROUND_DURATIONS[r.type], player.combo||0);
      player.score+=pts; player.combo=(player.combo||0)+1;
      r.answers[playerId]={value,correct:true,points:pts}; wasCorrect=true;
    } else {
      r.answers[playerId]={value,correct:false,points:0}; wasCorrect=false;
    }
    return s;
  });
  
  if(wasCorrect===true) AudioEngine.playCorrect(); else if(wasCorrect===false) AudioEngine.playWrong();
  const st=document.getElementById('tf-status')||document.getElementById('wo-status')||document.getElementById('sign-status')||document.getElementById('match-status');
  if(st){ st.textContent='Skickat! Väntar på övriga...'; st.className='status-line'; }
}
