<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpråkStudio Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
:root{
  --accent:#2B7DE0; --accent-dark:#195CA8; --accent-light:#EAF2FC;
  --yellow:#FFC72C; --yellow-dark:#8A6200; --yellow-border:#E8B000;
  --bg:#F3F6FA; --card:#FFFFFF; --border:#DCE6F2;
  --ink:#233246; --muted:#7C8CA0;
  --green:#2E9E52; --red:#D9534F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;font-family:'Nunito',sans-serif;
  background:var(--bg); color:var(--ink); -webkit-user-select:none; user-select:none;}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 3vw;}
.hidden{display:none !important;}
.msi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 40;vertical-align:middle;line-height:1;}
h1{font-family:'Fredoka',sans-serif;color:var(--accent-dark);font-size:clamp(1.6rem,3.4vw,2.4rem);margin:0 0 .2em;font-weight:600;}
h2{font-family:'Fredoka',sans-serif;color:var(--ink);font-size:clamp(1.2rem,2.1vw,1.6rem);margin:.2em 0;font-weight:600;}
p.sub{color:var(--muted);font-weight:600;margin-top:0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 4px rgba(20,40,70,.06);
  padding:3vh 3vw;width:min(560px,92vw);text-align:center;}
.role-row{display:flex;gap:1.2rem;margin-top:1.8rem;justify-content:center;flex-wrap:wrap;}
.role-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;background:var(--card);color:var(--ink);
  border:1px solid var(--border);border-radius:16px;padding:1.6rem 2rem;cursor:pointer;box-shadow:0 1px 4px rgba(20,40,70,.06);
  display:flex;flex-direction:column;align-items:center;gap:.4rem;}
.role-btn:active{background:var(--accent-light);}
.role-btn .msi{font-size:2.4rem;color:var(--accent);}
input{font-family:'Nunito',sans-serif;font-weight:700;font-size:1.1rem;padding:.75rem 1rem;border-radius:10px;
  border:2px solid var(--border);width:100%;margin-top:.6rem;text-align:center;background:#fff;color:var(--ink);}
input:focus{outline:none;border-color:var(--accent);}
.primary-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;background:var(--accent);color:#fff;
  border:none;border-radius:10px;padding:.75rem 1.6rem;cursor:pointer;margin-top:1.1rem;}
.primary-btn:active{background:var(--accent-dark);}
.primary-btn:disabled{opacity:.4;}
.ghost-btn{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:1px solid var(--border);color:var(--muted);
  border-radius:10px;padding:.6em 1.2em;cursor:pointer;font-size:.95rem;}
.cancel-btn{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:1px solid var(--red);color:var(--red);
  border-radius:10px;padding:.5em 1em;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:.3em;}
.cancel-btn:active{background:#FBE7E6;}
.board-wrap{width:min(1150px,95vw);}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2vh;gap:1rem;}
.room-pill{background:var(--accent-light);color:var(--accent-dark);font-family:'Fredoka',sans-serif;font-weight:700;
  border-radius:10px;padding:.4em 1em;font-size:1rem;letter-spacing:.06em;}
.avatars{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:1vh;}
.avatar-pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:.35em .8em;display:flex;
  align-items:center;gap:.35em;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.95rem;}
.avatar-pill.is-drawer{background:var(--accent);color:#fff;border-color:var(--accent);}
.score{color:var(--accent-dark);font-weight:800;}
.avatar-pill.is-drawer .score{color:#fff;}
.lobby-code-wrap{text-align:center;width:100%;}
.code-display-big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(4.5rem,15vw,10rem);letter-spacing:.1em;
  color:var(--accent-dark);line-height:1;margin:1vh 0;}
.mini-leaderboard{position:absolute;top:1.2vh;right:1.2vw;background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:.6em .9em;color:var(--ink);font-family:'Fredoka',sans-serif;font-size:.9rem;z-index:5;}
.mini-leaderboard div{display:flex;justify-content:space-between;gap:1em;padding:.12em 0;}
.mini-leaderboard .lb-score{color:var(--accent-dark);font-weight:700;}
.round-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:3vh 3vw;width:100%;
  text-align:center;position:relative;}
.timer-bar-wrap{width:100%;height:10px;background:var(--accent-light);border-radius:999px;overflow:hidden;margin-bottom:1.4vh;}
.timer-bar{height:100%;background:var(--yellow);border-radius:999px;transition:width .3s linear;}
.round-type-label{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--accent-dark);font-size:.95rem;
  margin-bottom:.3em;display:flex;align-items:center;justify-content:center;gap:.3em;}
.word-hint{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.4rem);letter-spacing:.22em;
  color:var(--ink);}
canvas.draw-canvas{background:#fff;border:1px solid var(--border);border-radius:12px;touch-action:none;
  width:100%;max-width:560px;height:min(340px,42vh);}
.brush-row{display:flex;gap:.5rem;align-items:center;justify-content:center;margin-top:1rem;flex-wrap:wrap;}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
.swatch.active{border-color:var(--accent);}
.tool-btn{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:1px solid var(--accent);color:var(--accent);
  border-radius:10px;padding:.4em .8em;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:.25em;}
.tool-btn.active{background:var(--accent);color:#fff;}
.statement-text{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(1.1rem,2.2vw,1.5rem);color:var(--ink);
  margin:1rem 0 1.3rem;}
.tf-row{display:flex;gap:1rem;justify-content:center;}
.tf-btn{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;border:none;border-radius:12px;
  padding:1em 2em;cursor:pointer;color:#fff;}
.tf-btn.true{background:var(--green);}
.tf-btn.false{background:var(--red);}
.tf-btn:disabled{opacity:.4;}
.drag-row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin:1.2rem 0;min-height:3.6em;touch-action:none;}
.drag-chip{font-family:'Nunito',sans-serif;font-weight:800;background:var(--yellow);border:2px solid var(--yellow-border);
  color:var(--ink);border-radius:12px;padding:.7em 1.1em;cursor:grab;font-size:1.1rem;touch-action:none;
  user-select:none;position:relative;}
.drag-chip.jiggle{animation:jiggle .26s ease-in-out infinite;}
.drag-chip.dragging{opacity:.92;transform:scale(1.12) !important;z-index:20;box-shadow:0 8px 18px rgba(0,0,0,.25);
  animation:none;cursor:grabbing;}
@keyframes jiggle{0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
.sign-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.1em 1.3em;margin:1rem auto;
  max-width:360px;text-align:left;font-family:'Nunito',sans-serif;}
.sign-box .sign-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.05rem;color:var(--accent-dark);
  display:flex;align-items:center;gap:.4em;margin-bottom:.4em;}
.sign-box .sign-line{font-size:.98rem;color:var(--ink);padding:.15em 0;}
.choice-col{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem;max-width:400px;margin-left:auto;margin-right:auto;}
.choice-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:1rem;background:#fff;border:2px solid var(--accent);
  color:var(--ink);border-radius:12px;padding:.8em 1.1em;cursor:pointer;}
.choice-btn:active{background:var(--accent);color:#fff;}
.choice-btn:disabled{opacity:.4;}
.match-columns{display:flex;gap:1.6rem;justify-content:center;margin:1rem 0;}
.match-col{display:flex;flex-direction:column;gap:.5rem;}
.match-tile{font-family:'Nunito',sans-serif;font-weight:700;background:#fff;border:2px solid var(--accent);color:var(--ink);
  border-radius:10px;padding:.55em 1em;cursor:pointer;min-width:84px;text-align:center;font-size:1.05rem;}
.match-tile.selected{background:var(--accent);color:#fff;}
.match-tile.matched{background:#E7F5EA;border-color:var(--green);color:var(--green);opacity:.6;pointer-events:none;}
.status-line{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--muted);margin-top:.5rem;font-size:.92rem;}
.status-line.almost{color:var(--yellow-dark);}
.status-line.wrong{color:var(--red);}
.status-line.right{color:var(--green);}
.result-flash{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;margin-top:.7rem;}
.result-flash.correct{color:var(--green);}
.result-flash.wrong{color:var(--red);}
.leaderboard-table{width:100%;border-collapse:collapse;margin-top:1rem;}
.leaderboard-table td{padding:.45em .3em;font-family:'Nunito',sans-serif;font-weight:700;text-align:left;border-bottom:1px solid var(--border);}
.leaderboard-table .rank{font-family:'Fredoka',sans-serif;color:var(--accent);width:2em;}
.leaderboard-table .delta-up{color:var(--green);}
.leaderboard-table .delta-down{color:var(--red);}
.leaderboard-table .gained{color:var(--accent-dark);font-family:'Fredoka',sans-serif;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1rem;margin:2vh 0;}
.podium-slot{background:var(--accent-light);border-radius:12px 12px 0 0;padding:1rem;text-align:center;
  font-family:'Fredoka',sans-serif;font-weight:700;color:var(--ink);}
.podium-slot.p1{height:170px;background:var(--accent);color:#fff;}
.podium-slot.p2{height:130px;}
.podium-slot.p3{height:100px;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
.pulse{animation:pulse 1.3s infinite ease-in-out;}
.player-idle{text-align:center;}
.player-idle .big-emoji{font-size:3.2rem;color:var(--accent);}
.player-name-tag{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.2rem;color:var(--ink);}
</style>
</head>
<body>
<div id="app">

<div id="role-screen">
  <h1>🇸🇪 SpråkStudio Party</h1>
  <p class="sub">Vem är du?</p>
  <div class="role-row">
    <button class="role-btn" id="host-role-btn"><span class="msi">desktop_windows</span>Lärare<br>(smartboard)</button>
    <button class="role-btn" id="player-role-btn"><span class="msi">tablet_mac</span>Elev<br>(iPad)</button>
  </div>
</div>

<div id="host-create-screen" class="hidden">
  <div class="card"><h2>Skapa ett rum</h2>
    <button class="primary-btn" id="create-room-btn">Skapa rum</button>
  </div>
</div>

<div id="host-board-screen" class="hidden board-wrap" style="position:relative;">
  <div class="top-bar">
    <div class="room-pill hidden" id="host-room-code">KOD: ----</div>
    <button class="cancel-btn" id="cancel-room-btn"><span class="msi">cancel</span> Avbryt rummet</button>
  </div>
  <div class="avatars hidden" id="host-avatars"></div>

  <div id="host-lobby-view" class="lobby-code-wrap">
    <p class="sub">Rumskod</p>
    <div class="code-display-big" id="lobby-code-big">----</div>
    <div class="avatars" id="lobby-avatars-big"></div>
    <button class="primary-btn" id="start-game-btn" disabled>Starta spelet</button>
  </div>

  <div id="host-round-view" class="hidden" style="position:relative;width:100%;">
    <div class="mini-leaderboard" id="host-mini-lb"></div>
    <div class="round-card">
      <div class="round-type-label" id="round-type-label"></div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="host-timer-bar" style="width:100%;"></div></div>
      <div id="round-content-host"></div>
    </div>
  </div>
  <div id="host-roundend-view" class="hidden card" style="width:100%;">
    <h2 id="roundend-title">Rundan är slut!</h2>
    <p class="sub" id="roundend-reveal"></p>
    <table class="leaderboard-table" id="roundend-table"></table>
    <button class="primary-btn" id="next-round-btn">Nästa runda</button>
    <button class="ghost-btn" id="end-game-btn" style="margin-top:.8rem;">Avsluta spelet</button>
  </div>
  <div id="host-finished-view" class="hidden card" style="width:100%;">
    <h2>🏆 Spelet är slut!</h2>
    <div class="podium" id="podium"></div>
  </div>
</div>

<div id="player-join-screen" class="hidden">
  <div class="card"><h2>Gå med i rummet</h2>
    <input id="join-code" placeholder="KOD" maxlength="4" style="text-transform:uppercase;">
    <input id="join-name" placeholder="Ditt namn" maxlength="16">
    <button class="primary-btn" id="join-btn">Gå med</button>
    <div id="join-error" style="color:var(--red);font-weight:700;margin-top:.5rem;"></div>
  </div>
</div>

<div id="player-game-screen" class="hidden" style="width:min(480px,94vw);">
  <div class="card" style="width:100%;">
    <div id="player-idle-view" class="player-idle">
      <div class="big-emoji msi">hourglass_top</div>
      <div class="player-name-tag" id="player-name-tag"></div>
      <p class="sub" id="player-status-text">Väntar på läraren...</p>
    </div>
    <div id="player-round-view" class="hidden">
      <div class="mini-leaderboard" id="player-mini-lb" style="position:static;display:inline-block;margin-bottom:1rem;"></div>
      <div id="round-content-player"></div>
    </div>
    <div id="player-roundend-view" class="hidden">
      <div class="big-emoji msi" id="roundend-player-icon">emoji_events</div>
      <div id="roundend-player-text" class="result-flash"></div>
      <p class="sub">Väntar på läraren...</p>
    </div>
  </div>
</div>

</div>

const NON_DRAW_TYPES=["truefalse","wordorder","sign","match"];

async function readRoom(code){
  try{const r=await fetch('/api/room?code='+encodeURIComponent(code));if(!r.ok)return null;
    const j=await r.json();return j.value||null;}catch(e){return null;}
}
async function writeRoom(code,state){
  try{const r=await fetch('/api/room',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code,state})});return r.ok;}catch(e){return false;}
}
async function updateRoom(code,mutateFn,retries=5){
  for(let i=0;i<retries;i++){
    const cur=await readRoom(code); if(!cur) return false;
    const next=mutateFn(JSON.parse(JSON.stringify(cur))); if(!next) return false;
    if(await writeRoom(code,next)) return true;
  }
  return false;
}
function randomCode(){const L="ABCDEFGHJKLMNPQRSTUVWXYZ";let c="";for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c;}
function newId(){return Math.random().toString(36).slice(2,10);}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNotEqual(arr){
  if(arr.length<2) return arr.slice();
  let s;
  do{ s=shuffle(arr); }while(JSON.stringify(s)===JSON.stringify(arr));
  return s;
}
function calcScore(timeLeftFraction,combo){
  const base=200+Math.round(800*Math.max(0,Math.min(1,timeLeftFraction)));
  const mult=1+0.1*Math.min(combo,5);
  return Math.round(base*mult);
}
function normalizeSwedish(s){
  return s.toLowerCase().trim().replace(/å|ä/g,'a').replace(/ö/g,'o');
}
function similarity(a,b){
  const m=a.length,n=b.length;
  if(m===0) return n===0?1:0;
  if(n===0) return 0;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const dist=dp[m][n]; const maxLen=Math.max(m,n);
  return maxLen===0?1:1-dist/maxLen;
}

  ['role-screen','host-create-screen','host-board-screen','player-join-screen','player-game-screen']

/* ================= ROUND BUILDERS ================= */
function buildRound(type,drawerId){
  if(type==='draw'){
    const catKeys=Object.keys(DRAW_CATEGORIES);
    const cat=DRAW_CATEGORIES[pickRandom(catKeys)];
    const word=pickRandom(cat.words);
    return {type:'draw',drawerId,word,wordLength:word.length,emoji:cat.emoji,strokes:[],correctPlayerIds:[]};
  }
  if(type==='truefalse'){
    const s=pickRandom(STATEMENTS);
    return {type:'truefalse',statement:s.text,isTrue:s.isTrue};
  }
  if(type==='wordorder'){
    const words=pickRandom(SENTENCES);
    return {type:'wordorder',correctOrder:words,scrambled:shuffleNotEqual(words)};
  }
  if(type==='sign'){
    const s=pickRandom(SIGNS);
    return {type:'sign',icon:s.icon,title:s.title,lines:s.lines,question:s.question,choices:s.choices,correct:s.correct};
  }
  if(type==='match'){
    const pairs=shuffle(MATCH_PAIRS_POOL).slice(0,4);
    return {type:'match',pairs};
  }
}
function buildPlan(players){
  const plan=[];
  players.forEach(p=>{
    plan.push({type:'draw',drawerId:p.id});
    plan.push({type:pickRandom(NON_DRAW_TYPES)});
  });
  return plan;
}

let hostCode=null, hostPollTimer=null, hostRenderedRoundKey=null;

document.getElementById('create-room-btn').addEventListener('click', async ()=>{
  hostCode=randomCode();
  const initial={code:hostCode,phase:'lobby',players:[],plan:[],planIndex:-1,round:null,lastRoundResult:null};
  await writeRoom(hostCode,initial);
  document.getElementById('lobby-code-big').textContent=hostCode;
  document.getElementById('host-room-code').textContent='KOD: '+hostCode;
  show('host-board-screen');
  hostPollTimer=setInterval(hostPoll,1000);
  hostPoll();
});

document.getElementById('cancel-room-btn').addEventListener('click', async ()=>{
  if(!confirm('Avbryta rummet? Alla elever kopplas bort.')) return;
  await updateRoom(hostCode, s=>{ s.phase='cancelled'; return s; });
  clearInterval(hostPollTimer);
  show('role-screen');
});

async function hostPoll(){
  const state=await readRoom(hostCode); if(!state) return;
  const isLobby = state.phase==='lobby';
  document.getElementById('host-room-code').classList.toggle('hidden', isLobby);
  document.getElementById('host-avatars').classList.toggle('hidden', isLobby);
  if(!isLobby) renderAvatars(document.getElementById('host-avatars'),state);
  renderAvatars(document.getElementById('lobby-avatars-big'),state);
  document.getElementById('start-game-btn').disabled = state.players.length<1;
  document.getElementById('host-lobby-view').classList.toggle('hidden', state.phase!=='lobby');
  document.getElementById('host-round-view').classList.toggle('hidden', state.phase!=='active');
  document.getElementById('host-roundend-view').classList.toggle('hidden', state.phase!=='round-end');
  document.getElementById('host-finished-view').classList.toggle('hidden', state.phase!=='finished');

  if(state.phase==='active' && state.round){
    renderMiniLB(document.getElementById('host-mini-lb'),state);
    const dur=ROUND_DURATIONS[state.round.type];
    const elapsed=(Date.now()-state.round.startedAt)/1000;
    const timeLeft=Math.max(0,dur-elapsed);
    document.getElementById('host-timer-bar').style.width=(100*timeLeft/dur)+'%';
    const key=state.round.type+':'+(state.round.word||state.round.statement||state.round.title||JSON.stringify(state.round.correctOrder||state.round.pairs))+':'+state.planIndex;
    if(hostRenderedRoundKey!==key){ hostRenderedRoundKey=key; renderHostRound(state); }
    else if(state.round.type==='draw'){ redrawCanvas(document.getElementById('host-canvas'),state.round.strokes); }

    const answeredCount=Object.keys(state.round.answers||{}).length;
    const doneEarly = state.round.type==='draw'
      ? (state.round.correctPlayerIds||[]).length >= (state.players.length-1) && state.players.length>1
      : answeredCount >= state.players.length;
    if(timeLeft<=0 || doneEarly){ await finalizeRound(state); }
  }
  if(state.phase==='round-end'){ renderRoundEnd(state); }
  if(state.phase==='finished'){ renderPodium(state); }
}

function renderAvatars(wrap,state){
  wrap.innerHTML='';
  state.players.forEach(p=>{
    const isDrawer = state.round && state.round.type==='draw' && state.round.drawerId===p.id && state.phase==='active';
    const pill=document.createElement('div');
    pill.className='avatar-pill'+(isDrawer?' is-drawer':'');
    pill.innerHTML=`${p.avatar} ${p.name} <span class="score">${p.score}</span>`;
    wrap.appendChild(pill);
  });
}
function renderMiniLB(el,state){
  const sorted=[...state.players].sort((a,b)=>b.score-a.score).slice(0,4);
  el.innerHTML=sorted.map(p=>`<div><span>${p.avatar} ${p.name}</span><span class="lb-score">${p.score}</span></div>`).join('');
}

function renderHostRound(state){
  const r=state.round;
  const label=document.getElementById('round-type-label');
  const body=document.getElementById('round-content-host');
  if(r.type==='draw'){
    label.innerHTML=`<span class="msi">brush</span> Rita & Gissa`;
    body.innerHTML=`<div class="word-hint">${'_ '.repeat(r.wordLength)}</div>
      <canvas class="draw-canvas" id="host-canvas" width="560" height="340"></canvas>`;
    redrawCanvas(document.getElementById('host-canvas'),r.strokes);
  } else if(r.type==='truefalse'){
    label.innerHTML=`<span class="msi">quiz</span> Rätt eller fel`;
    body.innerHTML=`<div class="statement-text">"${r.statement}"</div>`;
  } else if(r.type==='wordorder'){
    label.innerHTML=`<span class="msi">drag_indicator</span> Bygg meningen`;
    body.innerHTML=`<div class="drag-row">${r.scrambled.map(w=>`<span class="drag-chip" style="cursor:default;animation:none;">${w}</span>`).join('')}</div>`;
  } else if(r.type==='sign'){
    label.innerHTML=`<span class="msi">signpost</span> Vad säger skylten?`;
    body.innerHTML = renderSignHTML(r) + `<div class="statement-text" style="font-size:1.15rem;">${r.question}</div>`;
  } else if(r.type==='match'){
    label.innerHTML=`<span class="msi">join_inner</span> Para ihop`;
    body.innerHTML=`<div style="font-size:2.2rem;">${r.pairs.map(p=>p.emoji).join('   ')}</div>
      <p class="status-line">Para ordet med bilden på din iPad</p>`;
  }
}
function renderSignHTML(r){
  return `<div class="sign-box">
    <div class="sign-title"><span class="msi">${r.icon}</span>${r.title}</div>
    ${r.lines.map(l=>`<div class="sign-line">${l}</div>`).join('')}
  </div>`;
}
function redrawCanvas(canvas,strokes){
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  (strokes||[]).forEach(s=>{
    if(!s.points||s.points.length<1) return;
    ctx.globalCompositeOperation = s.mode==='eraser' ? 'destination-out' : 'source-over';
    ctx.beginPath();
    ctx.strokeStyle=s.color; ctx.lineWidth=s.size; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.moveTo(s.points[0].x*canvas.width,s.points[0].y*canvas.height);
    for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x*canvas.width,s.points[i].y*canvas.height);
    ctx.stroke();
  });
  ctx.globalCompositeOperation='source-over';
}

async function finalizeRound(state){
  const scoreSnapshot=state.round.scoreSnapshot || {};
  const rankBefore=[...state.players].sort((a,b)=>(scoreSnapshot[b.id]||0)-(scoreSnapshot[a.id]||0)).map(p=>p.id);

  await updateRoom(hostCode, s=>{
    if(s.phase!=='active') return s;
    const r=s.round;
    if(r.type==='draw'){
      const correctIds=r.correctPlayerIds||[];
      const drawer=s.players.find(p=>p.id===r.drawerId);
      if(drawer){
        drawer.score += 50*correctIds.length;
        drawer.combo = correctIds.length>0 ? (drawer.combo||0)+1 : 0;
      }
      s.players.forEach(p=>{
        if(p.id!==r.drawerId && !correctIds.includes(p.id)) p.combo=0;
      });
    } else {
      const answers=r.answers||{};
      s.players.forEach(p=>{
        const a=answers[p.id];
        if(!a || !a.correct) p.combo=0;
      });
    }
    const rankAfter=[...s.players].sort((a,b)=>b.score-a.score).map(p=>p.id);
    const pointsThisRound={};
    s.players.forEach(p=>{ pointsThisRound[p.id]=p.score-(scoreSnapshot[p.id]||0); });
    s.lastRoundResult={type:r.type, reveal:revealText(r), rankBefore, rankAfter, pointsThisRound};
    s.phase='round-end';
    return s;
  });
}
function revealText(r){
  if(r.type==='draw') return 'Ordet var: '+r.word;
  if(r.type==='truefalse') return r.isTrue ? 'Sant!' : 'Falskt!';
  if(r.type==='wordorder') return 'Rätt mening: '+r.correctOrder.join(' ');
  if(r.type==='sign') return 'Rätt svar: '+r.correct;
  if(r.type==='match') return 'Paren: '+r.pairs.map(p=>p.word+' '+p.emoji).join(', ');
}

function renderRoundEnd(state){
  const res=state.lastRoundResult;
  document.getElementById('roundend-reveal').textContent = res ? res.reveal : '';
  const table=document.getElementById('roundend-table');
  const sorted=[...state.players].sort((a,b)=>b.score-a.score);
  table.innerHTML = sorted.map((p,i)=>{
    const before=res.rankBefore.indexOf(p.id);
    const after=res.rankAfter.indexOf(p.id);
    let arrow='';
    if(before>after) arrow=`<span class="delta-up">▲${before-after}</span>`;
    else if(before<after) arrow=`<span class="delta-down">▼${after-before}</span>`;
    else arrow='–';
    const gained=res.pointsThisRound[p.id]||0;
    return `<tr><td class="rank">#${i+1}</td><td>${p.avatar} ${p.name}</td>
      <td>${arrow}</td><td class="gained">+${gained}</td><td>${p.score}</td></tr>`;
  }).join('');
}
function renderPodium(state){
  const sorted=[...state.players].sort((a,b)=>b.score-a.score);
  const el=document.getElementById('podium');
  const slots=[[1,'p1'],[0,'p2'],[2,'p3']];
  el.innerHTML = slots.filter(([idx])=>sorted[idx]).map(([idx,cls])=>{
    const p=sorted[idx];
    return `<div class="podium-slot ${cls}"><div style="font-size:1.8rem;">${p.avatar}</div>${p.name}<br>${p.score}p</div>`;
  }).join('');
}

document.getElementById('start-game-btn').addEventListener('click', async ()=>{
  const state=await readRoom(hostCode); if(!state||state.players.length<1) return;
  const plan=buildPlan(state.players);
  await updateRoom(hostCode, s=>{ s.plan=plan; s.planIndex=-1; return s; });
  await advanceRound();
});
document.getElementById('next-round-btn').addEventListener('click', advanceRound);
document.getElementById('end-game-btn').addEventListener('click', async ()=>{
  await updateRoom(hostCode, s=>{ s.phase='finished'; return s; });
});

async function advanceRound(){
  await updateRoom(hostCode, s=>{
    let idx=s.planIndex+1;
    if(idx>=s.plan.length){ s.plan=s.plan.concat(buildPlan(s.players)); }
    const planItem=s.plan[idx];
    const round=buildRound(planItem.type, planItem.drawerId);
    round.startedAt=Date.now();
    round.answers={};
    const snap={}; s.players.forEach(p=>snap[p.id]=p.score);
    round.scoreSnapshot=snap;
    s.round=round; s.planIndex=idx; s.phase='active';
    return s;
  });
  hostRenderedRoundKey=null;
}

  show('player-game-screen');

async function playerPoll(){
  const state=await readRoom(playerCode); if(!state) return;
  const idle=document.getElementById('player-idle-view');
  const roundView=document.getElementById('player-round-view');
  const endView=document.getElementById('player-roundend-view');

  if(state.phase==='cancelled'){
    [roundView,endView].forEach(v=>v.classList.add('hidden'));
    idle.classList.remove('hidden');
    document.getElementById('player-status-text').textContent='Läraren avslutade rummet.';
    clearInterval(playerPollTimer);
    return;
  }

  [idle,roundView,endView].forEach(v=>v.classList.add('hidden'));

  if(state.phase==='lobby'){
    idle.classList.remove('hidden');
    document.getElementById('player-status-text').textContent='Väntar på läraren...';
  } else if(state.phase==='active' && state.round){
    roundView.classList.remove('hidden');
    renderMiniLB(document.getElementById('player-mini-lb'),state);
    const key=state.round.type+':'+(state.round.word||state.round.statement||state.round.title||JSON.stringify(state.round.correctOrder||state.round.pairs))+':'+state.planIndex;
    if(playerRenderedRoundKey!==key){ playerRenderedRoundKey=key; renderPlayerRound(state); }
    else if(state.round.type==='draw' && state.round.drawerId!==playerId){
      redrawCanvas(document.getElementById('player-canvas'),state.round.strokes);
      const gs=document.getElementById('player-guess-status');
      if(gs && (state.round.correctPlayerIds||[]).includes(playerId)){
        gs.textContent='Rätt! Väntar...'; gs.className='status-line right';
        const inp=document.getElementById('guess-input'); if(inp) inp.disabled=true;
        const btn=document.getElementById('guess-submit-btn'); if(btn) btn.disabled=true;
      }
    }
  } else if(state.phase==='round-end'){
    endView.classList.remove('hidden');
    const res=state.lastRoundResult;
    const gained = res ? (res.pointsThisRound[playerId]||0) : 0;
    const t=document.getElementById('roundend-player-text');
    t.className='result-flash '+(gained>0?'correct':'wrong');
    t.textContent = gained>0 ? ('+'+gained+' poäng!') : (res ? res.reveal : '');
  } else if(state.phase==='finished'){
    endView.classList.remove('hidden');
    document.getElementById('roundend-player-text').className='result-flash correct';
    document.getElementById('roundend-player-text').textContent='Spelet är slut! 🏆';
  }
}

function renderDragChips(container, order){
  container.innerHTML='';
  order.forEach((w)=>{
    const el=document.createElement('div');
    el.className='drag-chip jiggle';
    el.textContent=w;
    el.style.animationDelay=(Math.random()*0.2).toFixed(2)+'s';
    container.appendChild(el);
    attachDragHandlers(el, container, order);
  });
}
function attachDragHandlers(el, container, order){
  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging'); el.classList.remove('jiggle');
    function onMove(ev){
      const children=[...container.children].filter(c=>c!==el);
      const x=ev.clientX;
      let insertBefore=null;
      for(const child of children){
        const rect=child.getBoundingClientRect();
        if(x < rect.left+rect.width/2){ insertBefore=child; break; }
      }
      if(insertBefore) container.insertBefore(el, insertBefore);
      else container.appendChild(el);
    }
    function onUp(){
      try{ el.releasePointerCapture(e.pointerId); }catch(err){}
      el.classList.remove('dragging'); el.classList.add('jiggle');
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      const newOrder=[...container.children].map(c=>c.textContent);
      order.length=0; order.push(...newOrder);
    }
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
  });
}

function renderMatchColumns(){
  const wordsWrap=document.getElementById('match-words');
  const emojisWrap=document.getElementById('match-emojis');
  wordsWrap.innerHTML=''; emojisWrap.innerHTML='';
  matchState.shuffledWords.forEach(w=>{
    const el=document.createElement('div');
    el.className='match-tile'+(matchState.matchedWords.includes(w)?' matched':'');
    el.textContent=w;
    el.addEventListener('click', ()=>onMatchWordClick(w,el));
    wordsWrap.appendChild(el);
  });
  matchState.shuffledEmojis.forEach(em=>{
    const el=document.createElement('div');
    const pair=matchState.pairs.find(p=>p.emoji===em);
    el.className='match-tile'+(matchState.matchedWords.includes(pair.word)?' matched':'');
    el.textContent=em;
    el.addEventListener('click', ()=>onMatchEmojiClick(em,el));
    emojisWrap.appendChild(el);
  });
}
function onMatchWordClick(w,el){
  if(el.classList.contains('matched')) return;
  document.querySelectorAll('#match-words .match-tile').forEach(t=>t.classList.remove('selected'));
  matchState.selectedWord=w; el.classList.add('selected');
  tryMatch();
}
function onMatchEmojiClick(em,el){
  if(el.classList.contains('matched')) return;
  document.querySelectorAll('#match-emojis .match-tile').forEach(t=>t.classList.remove('selected'));
  matchState.selectedEmoji=em; el.classList.add('selected');
  tryMatch();
}
function tryMatch(){
  if(!matchState.selectedWord || !matchState.selectedEmoji) return;
  const pair=matchState.pairs.find(p=>p.word===matchState.selectedWord);
  if(pair.emoji===matchState.selectedEmoji){
    matchState.matchedWords.push(matchState.selectedWord);
    matchState.selectedWord=null; matchState.selectedEmoji=null;
    renderMatchColumns();
    if(matchState.matchedWords.length===matchState.pairs.length){
      document.getElementById('match-status').textContent='Klart!';
      submitAnswer(true);
    }
  } else {
    document.getElementById('match-status').textContent='Fel par, försök igen';
    setTimeout(()=>{
      matchState.selectedWord=null; matchState.selectedEmoji=null;
      document.querySelectorAll('.match-tile.selected').forEach(t=>t.classList.remove('selected'));
    },450);
  }
}

function setupCanvasDrawing(){
  const canvas=document.getElementById('player-canvas');
  let drawing=false;
  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(clientX-rect.left)/rect.width, y:(clientY-rect.top)/rect.height};
  }
  function start(e){ e.preventDefault(); drawing=true;
    const size = drawState.tool==='eraser' ? 22 : drawState.size;
    drawState.currentStroke={points:[getPos(e)],color:drawState.color,size,mode:drawState.tool};
    drawState.strokes.push(drawState.currentStroke); redrawCanvas(canvas,drawState.strokes);
  }
  function move(e){ if(!drawing) return; e.preventDefault();
    drawState.currentStroke.points.push(getPos(e)); redrawCanvas(canvas,drawState.strokes);
    const now=Date.now();
    if(now-drawState.lastSync>350){ drawState.lastSync=now; syncStrokes(); }
  }
  function end(e){ if(!drawing) return; drawing=false; syncStrokes(); }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});

  function setActiveTool(btn){
    document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active'); drawState.color=sw.dataset.color; drawState.tool='pen';
      document.getElementById('eraser-btn').classList.remove('active');
    });
  });
  document.getElementById('thin-btn').addEventListener('click', (e)=>{ drawState.size=4; drawState.tool='pen'; setActiveTool(e.target); document.getElementById('eraser-btn').classList.remove('active'); });
  document.getElementById('thick-btn').addEventListener('click', (e)=>{ drawState.size=10; drawState.tool='pen'; setActiveTool(e.target); document.getElementById('eraser-btn').classList.remove('active'); });
  document.getElementById('eraser-btn').addEventListener('click', (e)=>{ drawState.tool='eraser'; setActiveTool(e.currentTarget); });
  document.getElementById('clear-btn').addEventListener('click', ()=>{
    drawState.strokes=[]; redrawCanvas(canvas,[]); syncStrokes();
  });

  setInterval(async ()=>{
    const state=await readRoom(playerCode);
    if(state && state.round && state.round.type==='draw'){
      const count=(state.round.correctPlayerIds||[]).length;
      const total=state.players.length-1;
      const st=document.getElementById('drawer-status');
      if(st) st.textContent=count+' av '+total+' har gissat rätt';
    }
  },1200);
}
async function syncStrokes(){
  await updateRoom(playerCode, s=>{
    if(s.phase==='active' && s.round && s.round.type==='draw' && s.round.drawerId===playerId){
      s.round.strokes=drawState.strokes;
    }
    return s;
  });
}

async function submitGuess(){
  const input=document.getElementById('guess-input');
  const btn=document.getElementById('guess-submit-btn');
  const status=document.getElementById('player-guess-status');
  const val=input.value.trim(); if(!val) return;
  btn.disabled=true;
  let resultInfo=null;
  await updateRoom(playerCode, s=>{
    if(s.phase!=='active' || !s.round || s.round.type!=='draw') return s;
    const r=s.round;
    if((r.correctPlayerIds||[]).includes(playerId)){ resultInfo={correct:true}; return s; }
    const player=s.players.find(p=>p.id===playerId);
    const exact = val.toLowerCase()===r.word.toLowerCase();
    const diacriticMatch = !exact && normalizeSwedish(val)===normalizeSwedish(r.word);
    const isCorrect = exact || diacriticMatch;
    if(isCorrect){
      const dur=ROUND_DURATIONS.draw;
      const timeLeft=Math.max(0,dur-(Date.now()-r.startedAt)/1000);
      const pts=calcScore(timeLeft/dur, player.combo||0);
      player.score+=pts; player.combo=(player.combo||0)+1;
      r.correctPlayerIds=(r.correctPlayerIds||[]).concat(playerId);
      r.answers=r.answers||{}; r.answers[playerId]={value:val,correct:true,points:pts};
      resultInfo={correct:true};
    } else {
      const sim=Math.round(similarity(normalizeSwedish(val),normalizeSwedish(r.word))*100);
      resultInfo={correct:false, sim};
    }
    return s;
  });
  btn.disabled=false;
  if(!status || !resultInfo) return;
  if(resultInfo.correct){
    status.textContent='Rätt! Väntar...'; status.className='status-line right';
    input.disabled=true; btn.disabled=true;
  } else if(resultInfo.sim>=60){
    status.textContent='Nästan rätt! ('+resultInfo.sim+'%) Försök igen'; status.className='status-line almost';
    input.value=''; input.focus();
  } else {
    status.textContent='Fel, försök igen'; status.className='status-line wrong';
    input.value=''; input.focus();
  }
}

async function submitAnswer(value){
  document.querySelectorAll('.tf-btn,.choice-btn').forEach(b=>b.disabled=true);
  await updateRoom(playerCode, s=>{
    if(s.phase!=='active' || !s.round) return s;
    const r=s.round;
    r.answers=r.answers||{};
    if(r.answers[playerId]) return s;
    let correct=false;
    if(r.type==='truefalse') correct = value===r.isTrue;
    else if(r.type==='wordorder') correct = JSON.stringify(value)===JSON.stringify(r.correctOrder);
    else if(r.type==='sign') correct = value===r.correct;
    else if(r.type==='match') correct = value===true;
    const player=s.players.find(p=>p.id===playerId);
    const dur=ROUND_DURATIONS[r.type];
    const timeLeft=Math.max(0,dur-(Date.now()-r.startedAt)/1000);
    if(correct){
      const pts=calcScore(timeLeft/dur, player.combo||0);
      player.score+=pts; player.combo=(player.combo||0)+1;
      r.answers[playerId]={value,correct:true,points:pts};
    } else {
      r.answers[playerId]={value,correct:false,points:0};
    }
    return s;
  });
  const st=document.getElementById('tf-status')||document.getElementById('wo-status')||document.getElementById('sign-status')||document.getElementById('match-status');
  if(st){ st.textContent='Skickat! Väntar på övriga...'; st.className='status-line'; }
}
</script>
